<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Chimera - 3D Battle Bots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Load Cannon.js library globally -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        body {
            font-family: 'Exo 2', sans-serif;
            background-color: #111827;
            color: #E5E7EB;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            position: absolute;
            z-index: 10;
            background-color: rgba(17, 24, 39, 0.6); /* Changed from 0.8 to 0.6 */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease-in-out;
        }
        .control-button {
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
        }
        .control-button:hover {
            transform: translateY(-2px);
            background-color: #374151;
            border-color: #4f5b70;
        }
        .control-button.active {
            background-color: #3B82F6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        /* Custom scrollbar for UI panels */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(55, 65, 81, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #6B7280;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }
    </style>
</head>
<body class="antialiased">

    <div id="canvas-container"></div>

    <!-- Left Side Panel: Inventory & Tools -->
    <div id="left-panel" class="ui-panel top-4 left-4 w-72 flex flex-col h-[calc(100vh-2rem)]">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-white tracking-wider">Project: Chimera</h1>
            <p class="text-xs text-gray-400">Advanced Robotics Workshop</p>
        </div>
        
        <!-- Tools -->
        <div class="p-4 border-b border-gray-700">
            <h2 class="text-lg font-semibold mb-3">Build Tools</h2>
            <div class="grid grid-cols-3 gap-2">
                <button id="tool-select" title="Select & Move (Q)" class="control-button active p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 19 2-7 7-2z"/></svg>
                </button>
                 <button id="tool-rotate" title="Rotate (E)" class="control-button p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2v6h6M21.5 22v-6h-6"/><path d="M22 11.5A10 10 0 0 0 3.5 12.5"/><path d="M2 12.5a10 10 0 0 0 18.5-1"/></svg>
                </button>
                <button id="tool-delete" title="Delete (Del)" class="control-button p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
                </button>
            </div>
        </div>

        <!-- Inventory -->
        <div class="p-4 flex-grow overflow-y-auto custom-scrollbar">
            <h2 class="text-lg font-semibold mb-3">Inventory</h2>
            <div id="inventory-parts" class="space-y-2">
                <!-- Parts will be dynamically injected here -->
            </div>
        </div>
    </div>
    
    <!-- Right Side Panel: Inspector -->
    <div id="inspector-panel" class="ui-panel top-4 right-4 w-80 h-[calc(100vh-2rem)] flex flex-col">
        <div class="p-4 border-b border-gray-700">
            <h2 class="text-lg font-semibold">Inspector</h2>
        </div>
        <div id="inspector-content" class="p-4 flex-grow overflow-y-auto custom-scrollbar">
            <p class="text-gray-400 text-center italic mt-4">Select a part to inspect its properties.</p>
        </div>
    </div>

    <!-- Bottom Center Panel: Mode & Sim Controls -->
    <div id="bottom-panel" class="ui-panel bottom-4 left-1/2 -translate-x-1/2 flex gap-4 p-3 items-center">
        <button id="build-mode-btn" class="control-button active px-6 py-2 rounded-md font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-4-3-5l-4.5-4.5-4.5 4.5c-2 1-3 3-3 5a7 7 0 0 0 7 7z"/></svg>
            Build
        </button>
        <button id="test-mode-btn" class="control-button px-6 py-2 rounded-md font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.66 4.96a1.32 1.32 0 0 0-1.2.14L3.14 9.42a1.32 1.32 0 0 0-.14 2.39l3.54 2.05 2.05 3.54a1.32 1.32 0 0 0 2.39-.14l4.32-6.32a1.32 1.32 0 0 0 .14-1.2L13.05 3.4a1.32 1.32 0 0 0-2.39 1.56Z"/><path d="m13.5 13.5 7 7"/></svg>
            Simulate
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
    }
    </script>

    <!-- Robot Controls UI (Thumbstick and Action Buttons) -->
    <div id="robot-controls-ui" class="hidden fixed inset-0 pointer-events-none"> <!-- Container for all controls -->
        <div id="thumbstick-area" class="absolute bottom-16 left-16 w-32 h-32 bg-gray-600/50 rounded-full flex justify-center items-center pointer-events-auto">
            <div id="thumbstick-handle" class="w-16 h-16 bg-blue-500/70 rounded-full"></div>
        </div>
        <div id="action-buttons-area" class="absolute bottom-16 right-16 flex flex-col gap-4 pointer-events-auto">
            <button id="action-button-1" class="w-20 h-20 bg-green-500/50 rounded-full text-white font-bold text-lg">A</button>
            <button id="action-button-2" class="w-20 h-20 bg-red-500/50 rounded-full text-white font-bold text-lg">B</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
        
        // CANNON is now available globally from the script loaded in the <head>

        class BattleBotsGame {
            constructor() {
                this.initEngine();
                this.initPhysics();
                this.initScene();
                this.initUI();
                this.initControls();
                this.initEventListeners();
                this.animate();
            }

            initEngine() {
                // --- Core Renderer ---
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
                this.camera.position.set(15, 12, 25);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                
                // --- Post-Processing ---
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.5, 0.2);
                this.composer.addPass(bloomPass);
                this.fxaaPass = new ShaderPass(FXAAShader);
                this.fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * this.renderer.getPixelRatio());
                this.fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * this.renderer.getPixelRatio());
                this.composer.addPass(this.fxaaPass);

                this.clock = new THREE.Clock();
                this.robotParts = [];
                this.constraints = [];
            }

            initPhysics() {
                // --- Cannon.js World ---
                this.world = new CANNON.World();
                this.world.gravity.set(0, -20, 0); // Stronger gravity
                this.world.broadphase = new CANNON.SAPBroadphase(this.world);
                this.world.solver.iterations = 20; // Increased iterations
                this.world.solver.tolerance = 0.01; // Added tolerance

                // Default contact material properties
                this.world.defaultContactMaterial.contactEquationStiffness = 1e7;
                this.world.defaultContactMaterial.contactEquationRelaxation = 4;
                
                // --- Materials ---
                this.physicsMaterials = {
                    ground: new CANNON.Material('ground'),
                    metal: new CANNON.Material('metal'),
                    wood: new CANNON.Material('wood'), // Represents a generic wood, can be a basis
                    rubber: new CANNON.Material('rubber'),
                    concrete: new CANNON.Material('concrete'),
                    hard_wood: new CANNON.Material('hard_wood'),
                    soft_wood: new CANNON.Material('soft_wood'),
                    hard_plastic: new CANNON.Material('hard_plastic'),
                    soft_plastic: new CANNON.Material('soft_plastic'),
                    rope_material: new CANNON.Material('rope_material')
                };
                
                // Existing contact materials
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.metal, { friction: 0.3, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.wood, { friction: 0.5, restitution: 0.4 })); // General wood
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.rubber, { friction: 0.8, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.metal, { friction: 0.2, restitution: 0.2 }));

                // New contact materials
                // Concrete interactions
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.concrete, { friction: 0.6, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.concrete, { friction: 0.7, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.concrete, this.physicsMaterials.concrete, { friction: 0.8, restitution: 0.05 }));


                // Hard Wood interactions
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.hard_wood, { friction: 0.55, restitution: 0.3 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.hard_wood, { friction: 0.45, restitution: 0.25 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.hard_wood, this.physicsMaterials.hard_wood, { friction: 0.5, restitution: 0.3 }));

                // Soft Wood interactions
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.soft_wood, { friction: 0.6, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.soft_wood, { friction: 0.5, restitution: 0.4 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.soft_wood, this.physicsMaterials.soft_wood, { friction: 0.55, restitution: 0.6 }));

                // Hard Plastic interactions
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.hard_plastic, { friction: 0.4, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.hard_plastic, { friction: 0.35, restitution: 0.15 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.hard_plastic, this.physicsMaterials.hard_plastic, { friction: 0.3, restitution: 0.2 }));

                // Soft Plastic interactions (can be similar to rubber or more bouncy)
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.soft_plastic, { friction: 0.7, restitution: 0.6 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.soft_plastic, { friction: 0.6, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.soft_plastic, this.physicsMaterials.soft_plastic, { friction: 0.65, restitution: 0.7 }));

                // Rope Material (placeholder values, usually very low restitution, high friction if tangled)
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.rope_material, { friction: 0.8, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.rope_material, { friction: 0.7, restitution: 0.1 }));
            }
            
            initScene() {
                this.scene.background = new THREE.Color(0x111827);
                this.scene.fog = new THREE.FogExp2(0x111827, 0.015);
                
                // --- Lighting ---
                this.scene.add(new THREE.AmbientLight(0x404040, 0.5));
                
                const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
                keyLight.position.set(20, 40, 30);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.width = 4096;
                keyLight.shadow.mapSize.height = 4096;
                keyLight.shadow.camera.near = 0.5;
                keyLight.shadow.camera.far = 100;
                keyLight.shadow.camera.left = -50;
                keyLight.shadow.camera.right = 50;
                keyLight.shadow.camera.top = 50;
                keyLight.shadow.camera.bottom = -50;
                this.scene.add(keyLight);
                
                const fillLight = new THREE.DirectionalLight(0x8899ff, 0.5);
                fillLight.position.set(-20, 10, -30);
                this.scene.add(fillLight);

                const rimLight = new THREE.SpotLight(0xff88cc, 3);
                rimLight.position.set(0, 20, -50);
                rimLight.angle = Math.PI / 8;
                rimLight.penumbra = 0.3;
                this.scene.add(rimLight);

                // --- Environment ---
                const groundGeo = new THREE.PlaneGeometry(200, 200);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.7, metalness: 0.1 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);
                
                const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: this.physicsMaterials.ground });
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                this.world.addBody(groundBody);
                
                // Environment grid
                const grid = new THREE.GridHelper(200, 100, 0x4f46e5, 0x444444);
                grid.material.opacity = 0.3;
                grid.material.transparent = true;
                this.scene.add(grid);

                // Build grid
                const buildGridSize = 50;
                const buildGridDivisions = 50;
                const buildGridColor = 0x00FFFF; // Using cyan for the build grid
                const buildGrid = new THREE.GridHelper(buildGridSize, buildGridDivisions, buildGridColor, buildGridColor);
                buildGrid.position.y = 0.1;
                buildGrid.material.opacity = 0.5; // Semi-transparent
                buildGrid.material.transparent = true;
                this.scene.add(buildGrid);

                // Build Node Highlight Pool
                this.buildNodeHighlights = [];
                this.maxBuildNodeHighlights = 50;
                const highlightGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16); // Small disc shape
                const highlightMat = new THREE.MeshBasicMaterial({
                    color: 0x00ff00,
                    transparent: true,
                    opacity: 0.5,
                    side: THREE.DoubleSide
                });
                for (let i = 0; i < this.maxBuildNodeHighlights; i++) {
                    const highlightMesh = new THREE.Mesh(highlightGeo, highlightMat);
                    highlightMesh.visible = false;
                    this.scene.add(highlightMesh);
                    this.buildNodeHighlights.push(highlightMesh);
                }
            }

            initUI() {
                this.partsData = {
                    // --- Existing Chassis Parts ---
                    'core_block': {
                        name: 'Power Core', type: 'chassis', size: [1, 1, 1], mass: 10, color: 0x3B82F6,
                        material: 'metal', // Maps to this.physicsMaterials.metal
                        health: 500,
                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12h6"/><path d="M12 9v6"/></svg>`,
                        buildNodes: [
                            {pos: [0, 0.5, 0], dir: [0,1,0], type: 'surface'}, {pos: [0, -0.5, 0], dir: [0,-1,0], type: 'surface'},
                            {pos: [0.5, 0, 0], dir: [1,0,0], type: 'surface'}, {pos: [-0.5, 0, 0], dir: [-1,0,0], type: 'surface'},
                            {pos: [0, 0, 0.5], dir: [0,0,1], type: 'surface'}, {pos: [0, 0, -0.5], dir: [0,0,-1], type: 'surface'}
                        ]
                    },
                    'metal_beam': {
                        name: 'Metal Beam', type: 'chassis', size: [4, 0.5, 0.5], mass: 8, color: 0x6B7280,
                        material: 'metal', // Maps to this.physicsMaterials.metal
                        health: 250,
                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v2H3zM3 20h18v2H3zM8 3v18M16 3v18"/></svg>`,
                        buildNodes: [ // Ends and main surfaces
                            {pos: [2, 0, 0], dir: [1,0,0], type: 'surface'}, {pos: [-2, 0, 0], dir: [-1,0,0], type: 'surface'},
                            {pos: [0, 0.25, 0], dir: [0,1,0], type: 'surface'}, {pos: [0, -0.25, 0], dir: [0,-1,0], type: 'surface'},
                            {pos: [0, 0, 0.25], dir: [0,0,1], type: 'surface'}, {pos: [0, 0, -0.25], dir: [0,0,-1], type: 'surface'}
                        ]
                    },

                    // --- New Structural Parts ---
                    'steel_chassis_block': {
                        name: 'Steel Chassis Block', type: 'chassis', size: [1, 1, 1], mass: 15, color: 0x52525B, // Darker grey for steel
                        material: 'metal', // Conceptual: 'steel', Maps to this.physicsMaterials.metal (or a new 'steel' if defined)

                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12h6"/><path d="M12 9v6"/></svg>`, // Using core_block icon
                        buildNodes: [
                            {pos: [0, 0.5, 0], dir: [0,1,0], type: 'surface'}, {pos: [0, -0.5, 0], dir: [0,-1,0], type: 'surface'},
                            {pos: [0.5, 0, 0], dir: [1,0,0], type: 'surface'}, {pos: [-0.5, 0, 0], dir: [-1,0,0], type: 'surface'},
                            {pos: [0, 0, 0.5], dir: [0,0,1], type: 'surface'}, {pos: [0, 0, -0.5], dir: [0,0,-1], type: 'surface'}
                        ]
                    },
                    'aluminum_beam_long': {
                        name: 'Aluminum Beam (Long)', type: 'structure', size: [6, 0.4, 0.4], mass: 5, color: 0xA1A1AA, // Lighter grey for aluminum
                        material: 'metal', // Conceptual: 'aluminum', Maps to this.physicsMaterials.metal (or a new 'aluminum')
                        health: 200,
                        icon: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v2H3zM3 20h18v2H3zM8 3v18M16 3v18"/></svg>`, // Using metal_beam icon
                        buildNodes: [
                            {pos: [3, 0, 0], dir: [1,0,0], type: 'surface_end'}, {pos: [-3, 0, 0], dir: [-1,0,0], type: 'surface_end'},
                            {pos: [0, 0.2, 0], dir: [0,1,0], type: 'surface_long'}, {pos: [0, -0.2, 0], dir: [0,-1,0], type: 'surface_long'},
                            {pos: [0, 0, 0.2], dir: [0,0,1], type: 'surface_side'}, {pos: [0, 0, -0.2], dir: [0,0,-1], type: 'surface_side'}
                        ]
                    },
                    'oak_plank': {
                        name: 'Oak Wood Plank', type: 'structure', size: [3, 1, 0.2], mass: 4, color: 0x8A5A2B, // Brown for oak
                        material: 'hard_wood', // Conceptual: 'oak_wood', Maps to this.physicsMaterials.hard_wood
                        health: 150,
                        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="1" ry="1"/></svg>`, // Simple rectangle
                        buildNodes: [
                            {pos: [0, 0.5, 0], dir: [0,1,0], type: 'surface_top'}, {pos: [0, -0.5, 0], dir: [0,-1,0], type: 'surface_bottom'},
                            {pos: [1.5, 0, 0], dir: [1,0,0], type: 'surface_end'}, {pos: [-1.5, 0, 0], dir: [-1,0,0], type: 'surface_end'},
                            {pos: [0, 0, 0.1], dir: [0,0,1], type: 'surface_edge'}, {pos: [0, 0, -0.1], dir: [0,0,-1], type: 'surface_edge'}
                        ]
                    },
                    'concrete_block': {
                        name: 'Concrete Block', type: 'structure', size: [2, 1, 1], mass: 30, color: 0x9CA3AF, // Grey for concrete
                        material: 'concrete', // Conceptual: 'concrete_composite', Maps to this.physicsMaterials.concrete
                        health: 600,
                        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>`, // Simple cube

            initControls() {
                this.orbitControls = new OrbitControls(this.camera, this.renderer.domElement);
                this.orbitControls.enablePan = true;
                this.orbitControls.minDistance = 5;
                this.orbitControls.maxDistance = 100;
                this.orbitControls.target.set(0, 2, 0);
                this.orbitControls.update();

                this.transformControls = new TransformControls(this.camera, this.renderer.domElement);
                this.transformControls.addEventListener('dragging-changed', (event) => {
                    this.orbitControls.enabled = !event.value;

                    if (event.value) { // Dragging starts
                        this.updateBuildNodeHighlights();
                    } else { // Dragging ends
                        // Hide all highlights when dragging stops.
                        // This is also done at the start of updateBuildNodeHighlights, but ensures cleanup if drag ends unexpectedly.
                        for (const highlightMesh of this.buildNodeHighlights) {
                            highlightMesh.visible = false;
                        }

                        // --- Snapping Logic ---
                        // This section handles snapping the dragged part to the closest compatible build node on another part.
                        const draggedMesh = this.transformControls.object;
                        this.updatePhysicsBody(draggedMesh); // Ensure physics body is up-to-date before snap calculations.

                        const draggedMeshWorldPosition = new THREE.Vector3(); // To store world position of the dragged mesh's origin.
                        draggedMesh.getWorldPosition(draggedMeshWorldPosition);
                        const draggedMeshWorldQuaternion = new THREE.Quaternion(); // To store world orientation of the dragged mesh.
                        draggedMesh.getWorldQuaternion(draggedMeshWorldQuaternion);

                        const snapThreshold = 1.5; // Maximum distance between a dragged node and a target node to be considered for snapping.
                        const orientationSnapThreshold = -0.9; // Dot product threshold for node normals to be considered opposing (close to -1).
                        let bestSnap = null; // Stores the best snap candidate found.
                        let minNodeDistance = Infinity; // Tracks the smallest distance for the best snap.

                        // The dragged mesh must have build nodes to participate in advanced snapping.
                        if (!draggedMesh.userData.buildNodes || draggedMesh.userData.buildNodes.length === 0) {
                            this.updatePhysicsBody(draggedMesh); // Update physics body with its current transform.
                            return;
                        }

                        // Iterate through all other parts in the scene to find potential snap targets.
                        for (const targetMesh of this.robotParts) {
                            // Cannot snap to itself or to parts without build nodes.
                            if (targetMesh === draggedMesh || !targetMesh.userData.buildNodes || targetMesh.userData.buildNodes.length === 0) continue;

                            const targetMeshWorldPosition = new THREE.Vector3(); // World position of the target mesh's origin.
                            targetMesh.getWorldPosition(targetMeshWorldPosition);
                            const targetMeshWorldQuaternion = new THREE.Quaternion(); // World orientation of the target mesh.
                            targetMesh.getWorldQuaternion(targetMeshWorldQuaternion);

                            // Iterate through each build node on the target mesh.
                            for (const targetNode of targetMesh.userData.buildNodes) {
                                // Convert target node's local position and direction to world space.
                                const worldTargetNodePos = new THREE.Vector3().fromArray(targetNode.pos).applyQuaternion(targetMeshWorldQuaternion).add(targetMeshWorldPosition);
                                const worldTargetNodeDir = new THREE.Vector3().fromArray(targetNode.dir).applyQuaternion(targetMeshWorldQuaternion).normalize();

                                // Iterate through each build node on the dragged mesh.
                                for (const draggedNode of draggedMesh.userData.buildNodes) {
                                    // Calculate the current world position of the dragged node (before any hypothetical snapping).
                                    const currentWorldDraggedNodePos = new THREE.Vector3().fromArray(draggedNode.pos).applyQuaternion(draggedMeshWorldQuaternion).add(draggedMeshWorldPosition);
                                    const distanceToTargetNode = currentWorldDraggedNodePos.distanceTo(worldTargetNodePos);

                                    // If this pair of nodes is too far apart, skip to the next one.
                                    if (distanceToTargetNode > snapThreshold) continue;

                                    // --- Orientation Alignment Calculation ---
                                    // Get the current world direction of the dragged node.
                                    const currentWorldDraggedNodeDir = new THREE.Vector3().fromArray(draggedNode.dir).applyQuaternion(draggedMeshWorldQuaternion).normalize();
                                    // The desired world direction for the dragged node is opposite to the target node's direction.
                                    const desiredWorldDraggedNodeDir = worldTargetNodeDir.clone().negate();

                                    // Calculate the rotation needed to align currentWorldDraggedNodeDir with desiredWorldDraggedNodeDir.
                                    const alignRotation = new THREE.Quaternion().setFromUnitVectors(currentWorldDraggedNodeDir, desiredWorldDraggedNodeDir);
                                    // Apply this alignment rotation to the dragged mesh's current world quaternion to get a hypothetical new orientation.
                                    const hypotheticalQuaternion = alignRotation.clone().multiply(draggedMeshWorldQuaternion);

                                    // --- Compatibility Check (Post-Hypothetical Alignment) ---
                                    // Calculate what the dragged node's direction would be if the mesh adopted the hypotheticalQuaternion.
                                    const futureWorldDraggedNodeDir = new THREE.Vector3().fromArray(draggedNode.dir).applyQuaternion(hypotheticalQuaternion).normalize();
                                    const dotProduct = futureWorldDraggedNodeDir.dot(worldTargetNodeDir);

                                    // Check if the normals are sufficiently opposing (dot product close to -1).
                                    if (dotProduct < orientationSnapThreshold) {
                                        // --- Position Calculation (to make nodes meet precisely) ---
                                        // Get the local position of the dragged node.
                                        const localDraggedNodePos = new THREE.Vector3().fromArray(draggedNode.pos);
                                        // Transform this local position by the hypotheticalQuaternion to find its offset from the mesh's origin in the new orientation (world space).
                                        const rotatedDraggedNodeOffset = localDraggedNodePos.clone().applyQuaternion(hypotheticalQuaternion);
                                        // To make the worldTargetNodePos and the (now rotated) worldDraggedNodePos coincide,
                                        // the dragged mesh's origin must be at worldTargetNodePos - rotatedDraggedNodeOffset.
                                        const hypotheticalPosition = worldTargetNodePos.clone().sub(rotatedDraggedNodeOffset);

                                        // If this snap is closer than previously found valid snaps, store it.
                                        if (distanceToTargetNode < minNodeDistance) {
                                            minNodeDistance = distanceToTargetNode;
                                            bestSnap = {
                                                distance: distanceToTargetNode, // Store the initial distance for comparison.
                                                calculatedPosition: hypotheticalPosition, // The calculated final position for the dragged mesh.
                                                calculatedQuaternion: hypotheticalQuaternion, // The calculated final orientation for the dragged mesh.
                                                draggedMesh: draggedMesh,
                                                targetMesh: targetMesh,
                                                draggedNodeData: draggedNode, // Specific node on the dragged part.
                                                targetNodeData: targetNode    // Specific node on the target part.
                                            };
                                        }
                                    }
                                }
                            }
                        }

                        // --- Apply Best Snap and Create Constraint ---
                        if (bestSnap) {
                            // Apply the calculated position and orientation to the dragged mesh.
                            bestSnap.draggedMesh.position.copy(bestSnap.calculatedPosition);
                            bestSnap.draggedMesh.quaternion.copy(bestSnap.calculatedQuaternion);
                            this.updatePhysicsBody(bestSnap.draggedMesh); // Synchronize the physics body.

                            // Create a lock constraint between the two bodies if one doesn't already exist.
                            const draggedBody = bestSnap.draggedMesh.userData.body;
                            const targetBody = bestSnap.targetMesh.userData.body;
                            let alreadyConstrained = false;
                            for (const constraint of this.constraints) {
                                if ((constraint.bodyA === draggedBody && constraint.bodyB === targetBody) ||
                                    (constraint.bodyA === targetBody && constraint.bodyB === draggedBody)) {
                                    alreadyConstrained = true;
                                    break;
                                }
                            }

                            if (!alreadyConstrained) {
                                const constraint = new CANNON.LockConstraint(draggedBody, targetBody);
                                this.world.addConstraint(constraint);
                                this.constraints.push(constraint);
                                // Store connection info on both meshes for potential future use (e.g., easy traversal, breaking connections).
                                draggedMesh.userData.connections = draggedMesh.userData.connections || [];
                                draggedMesh.userData.connections.push({ targetBodyId: targetBody.userData.id, constraint: constraint });
                                bestSnap.targetMesh.userData.connections = bestSnap.targetMesh.userData.connections || [];
                                bestSnap.targetMesh.userData.connections.push({ targetBodyId: draggedBody.userData.id, constraint: constraint });
                                console.log('Constraint added between:', draggedBody.userData.id, 'and', targetBody.userData.id);
                            }
                        } else {
                            // If no suitable snap was found, just update the physics body to the final dragged position.
                            this.updatePhysicsBody(draggedMesh);
                        }
                    } else if (!event.value) { // Dragging ended, but no object was being dragged (e.g. a click on empty space might trigger this).
                        // Ensure all highlights are hidden.
                        for (const highlightMesh of this.buildNodeHighlights) {
                            highlightMesh.visible = false;
                        }
                    }
                });
                this.transformControls.addEventListener('objectChange', () => this.updateBuildNodeHighlights());
                this.scene.add(this.transformControls);

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            getAllConnectedParts(startBody) {
                const allBodies = new Set();
                const queue = [startBody];
                allBodies.add(startBody);

                const bodyIdToBodyMap = new Map();
                this.world.bodies.forEach(b => {
                    if (b.userData && b.userData.id) {
                        bodyIdToBodyMap.set(b.userData.id, b);
                    }
                });

                let head = 0;
                while(head < queue.length) {
                    const currentBody = queue[head++];
                    const currentMesh = currentBody.userData.mesh;

                    if (currentMesh && currentMesh.userData.connections) {
                        for (const connection of currentMesh.userData.connections) {
                            const connectedBody = bodyIdToBodyMap.get(connection.targetBodyId);
                            if (connectedBody && !allBodies.has(connectedBody)) {
                                allBodies.add(connectedBody);
                                queue.push(connectedBody);
                            }
                        }
                    }
                }
                return Array.from(allBodies);
            }

            initThumbstickControls() {
                if (!this.thumbstickArea || !this.thumbstickHandle) {
                    console.warn("Thumbstick UI elements not found.");
                    return;
                }

                this.thumbstickArea.addEventListener('mousedown', (e) => this.handleThumbstickStart(e));
                this.thumbstickArea.addEventListener('touchstart', (e) => this.handleThumbstickStart(e), { passive: false });

                window.addEventListener('mousemove', (e) => this.handleThumbstickMove(e));
                window.addEventListener('touchmove', (e) => this.handleThumbstickMove(e), { passive: false });

                window.addEventListener('mouseup', (e) => this.handleThumbstickEnd(e));
                window.addEventListener('touchend', (e) => this.handleThumbstickEnd(e));
            }

            handleThumbstickStart(event) {
                if (this.mode !== 'test') return; // Only active in test mode
                event.preventDefault();
                this.thumbstickActive = true;
                // Recalculate radius here to be sure, useful if window was resized while UI hidden
                this.thumbstickRadius = this.thumbstickArea.offsetWidth / 2;
                const clientX = event.clientX || (event.touches && event.touches[0].clientX);
                const clientY = event.clientY || (event.touches && event.touches[0].clientY);
                if (clientX !== undefined) {
                    this.updateThumbstick(clientX, clientY);
                }
            }

            handleThumbstickMove(event) {
                if (!this.thumbstickActive || this.mode !== 'test') return;
                event.preventDefault();
                const clientX = event.clientX || (event.touches && event.touches[0].clientX);
                const clientY = event.clientY || (event.touches && event.touches[0].clientY);
                 if (clientX !== undefined) {
                    this.updateThumbstick(clientX, clientY);
                }
            }

            handleThumbstickEnd(event) {
                if (!this.thumbstickActive || this.mode !== 'test') return;
                this.thumbstickActive = false;
                this.thumbstickInput = { x: 0, y: 0 };
                this.thumbstickHandle.style.transform = 'translate(0px, 0px)';
            }

            updateThumbstick(clientX, clientY) {
                if (!this.thumbstickArea || !this.thumbstickHandle) return;

                const rect = this.thumbstickArea.getBoundingClientRect();
                const centerX = rect.left + this.thumbstickRadius;
                const centerY = rect.top + this.thumbstickRadius;

                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                const handleRadius = this.thumbstickHandle.offsetWidth / 2;
                const maxHandleRadius = this.thumbstickRadius - handleRadius;

                if (distance > maxHandleRadius) {
                    dx = (dx / distance) * maxHandleRadius;
                    dy = (dy / distance) * maxHandleRadius;
                }

                this.thumbstickHandle.style.transform = `translate(${dx}px, ${dy}px)`;

                // Normalize input to range -1 to 1
                // Ensure maxHandleRadius is not zero to prevent division by zero if UI isn't fully ready
                if (maxHandleRadius > 0) {
                    this.thumbstickInput.x = dx / maxHandleRadius;
                    this.thumbstickInput.y = -(dy / maxHandleRadius); // Inverted Y for typical game controls (up is positive)
                } else {
                    this.thumbstickInput.x = 0;
                    this.thumbstickInput.y = 0;
                }
                // console.log('Thumbstick Input:', this.thumbstickInput); // For debugging
            }


            // --- Core Logic ---

            /**
             * Updates the visibility and transform of build node highlights.
             * This method is called when a drag operation starts and as the dragged object moves.
             * It identifies and highlights compatible build nodes on other parts that are close to any
             * build node on the dragged part.
             */
            updateBuildNodeHighlights() {
                // Hide all highlights before recalculating.
                for (const highlight of this.buildNodeHighlights) {
                    highlight.visible = false;
                }

                // Only proceed if an object is being dragged with transform controls.
                if (!this.transformControls.object || !this.transformControls.dragging) {
                    return;
                }

                const draggedMesh = this.transformControls.object;
                // Dragged mesh must have build nodes to find compatible targets.
                if (!draggedMesh.userData.buildNodes || draggedMesh.userData.buildNodes.length === 0) {
                    return;
                }

                let highlightCount = 0; // Tracks how many highlights are currently shown.
                const proximityThreshold = 1.5; // Max distance between a dragged node and a target node to consider highlighting.
                const orientationDotThreshold = -0.7; // Dot product threshold: values < -0.7 indicate sufficiently opposing normals.

                const defaultUp = new THREE.Vector3(0, 1, 0); // Default 'up' vector for cylinder highlight orientation.

                // Pre-allocate THREE.js objects for use in loops to improve performance by avoiding repeated instantiation.
                const draggedMeshWorldPosition = new THREE.Vector3();
                draggedMesh.getWorldPosition(draggedMeshWorldPosition);
                const draggedMeshWorldQuaternion = new THREE.Quaternion();
                draggedMesh.getWorldQuaternion(draggedMeshWorldQuaternion);

                const worldDraggedNodePos = new THREE.Vector3();
                const worldDraggedNodeDir = new THREE.Vector3();
                const targetMeshWorldPosition = new THREE.Vector3();
                const worldTargetNodePos = new THREE.Vector3();
                const worldTargetNodeDir = new THREE.Vector3();


                for (const draggedNode of draggedMesh.userData.buildNodes) {
                    // Calculate the world position and direction of the current build node on the dragged mesh.
                    // These are calculated once per draggedNode, outside the inner loops.
                    worldDraggedNodePos.fromArray(draggedNode.pos).applyQuaternion(draggedMeshWorldQuaternion).add(draggedMeshWorldPosition);
                    worldDraggedNodeDir.fromArray(draggedNode.dir).applyQuaternion(draggedMeshWorldQuaternion).normalize();

                    // Iterate through all other parts in the scene to find potential snap targets.
                    for (const otherPartMesh of this.robotParts) {
                        if (otherPartMesh === draggedMesh || !otherPartMesh.userData.buildNodes || otherPartMesh.userData.buildNodes.length === 0) {
                            continue; // Skip self or parts without build nodes.
                        }

                        otherPartMesh.getWorldPosition(targetMeshWorldPosition);
                        const otherPartMeshWorldQuaternion = otherPartMesh.quaternion; // Get live quaternion of the target part.

                        // Iterate through each build node on the target mesh.
                        for (const targetNode of otherPartMesh.userData.buildNodes) {
                            // Calculate world position and direction of the current target node.
                            worldTargetNodePos.fromArray(targetNode.pos).applyQuaternion(otherPartMeshWorldQuaternion).add(targetMeshWorldPosition);
                            worldTargetNodeDir.fromArray(targetNode.dir).applyQuaternion(otherPartMeshWorldQuaternion).normalize();

                            // 1. Proximity Check: Are the dragged node and target node close enough?
                            const distance = worldDraggedNodePos.distanceTo(worldTargetNodePos);
                            if (distance > proximityThreshold) {
                                continue; // Skip if too far.
                            }

                            // 2. Orientation Compatibility Check: Are the node normals generally opposing?
                            // Dot product of two normalized vectors:
                            //  1: same direction
                            //  0: perpendicular
                            // -1: opposite direction
                            const dotProduct = worldDraggedNodeDir.dot(worldTargetNodeDir);
                            if (dotProduct > orientationDotThreshold) { // e.g., if dot is -0.5, it's > -0.7, so skip. If -0.9, it's < -0.7, so proceed.
                                continue; // Skip if normals are not sufficiently opposing.
                            }
                            // console.log(`Compatible node found: dist=${distance.toFixed(2)}, dot=${dotProduct.toFixed(2)} on target ${otherPartMesh.userData.partId} node ${targetNode.type}`);

                            // If both checks pass, this targetNode is a candidate for highlighting.
                            if (highlightCount >= this.maxBuildNodeHighlights) break; // Stop if highlight pool is exhausted.

                            const highlightMesh = this.buildNodeHighlights[highlightCount];
                            highlightMesh.position.copy(worldTargetNodePos);
                            // Orient the highlight (cylinder/disc) to lie flat on the target node's surface.
                            // The cylinder's default orientation has its length along the Y-axis.
                            // We want to align this Y-axis with the target node's world normal.
                            highlightMesh.quaternion.setFromUnitVectors(defaultUp, worldTargetNodeDir);
                            highlightMesh.visible = true;
                            highlightCount++;
                        }
                        if (highlightCount >= this.maxBuildNodeHighlights) break; // Break from otherPartMesh loop if pool exhausted.
                    }
                    if (highlightCount >= this.maxBuildNodeHighlights) break; // Break from draggedNode loop if pool exhausted.
                }
            }


            addPart(partId) {
                if (this.mode !== 'build') return;
                const data = this.partsData[partId];

                // --- Mesh ---
                const geo = new THREE.BoxGeometry(...data.size);
                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: data.material === 'metal' ? 0.3 : 0.8,
                    metalness: data.material === 'metal' ? 0.8 : 0.1,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.position.set(0, 5, 0);

                // --- Physics Body ---
                const shape = new CANNON.Box(new CANNON.Vec3(...data.size.map(s => s / 2)));
                const body = new CANNON.Body({
                    mass: data.mass,
                    position: new CANNON.Vec3().copy(mesh.position),
                    shape: shape,
                    material: this.physicsMaterials[data.material]
                });

                mesh.userData.body = body;
                // Ensure partId is stored on mesh.userData as well for easier access from mesh
                mesh.userData.partId = partId;
                // Deep copy buildNodes to mesh.userData
                if (data.buildNodes) {
                    mesh.userData.buildNodes = JSON.parse(JSON.stringify(data.buildNodes));
                } else {
                    mesh.userData.buildNodes = []; // Ensure it always has an array
                }
                body.userData = { mesh: mesh, id: THREE.MathUtils.generateUUID(), partId }; // partId on body.userData is fine too
                this.scene.add(mesh);
                this.world.addBody(body);
                this.robotParts.push(mesh);
                this.selectPart(mesh);
            }
            
            selectPart(mesh) {
                if(this.selectedPart === mesh) return;

                if (this.mode === 'build') {
                    this.transformControls.attach(mesh);
                    this.selectedPart = mesh;
                    this.updateInspector(mesh);
                }
            }

            updatePhysicsBody(mesh) {
                if (mesh && mesh.userData.body) {
                    mesh.userData.body.position.copy(mesh.position);
                    mesh.userData.body.quaternion.copy(mesh.quaternion);
                }
            }

            updateInspector(mesh) {
                if (!mesh) {
                    this.inspectorContent.innerHTML = `<p class="text-gray-400 text-center italic mt-4">Select a part to inspect.</p>`;
                    return;
                }
                const partId = mesh.userData.partId; // Already stored on mesh.userData.partId
                const partData = this.partsData[partId];
                let html = `
                    <div class="space-y-3">
                        <h3 class="text-xl font-bold text-white">${partData.name}</h3>
                        <div><strong>ID:</strong> <span class="text-gray-400 text-xs">${mesh.userData.body.userData.id}</span></div>
                        <div><strong>Mass:</strong> <span class="text-gray-300">${partData.mass} kg</span></div>
                        <div><strong>Health:</strong> <span class="text-gray-300">${partData.health} / ${partData.health}</span></div>
                        <div><strong>Material:</strong> <span class="text-gray-300 capitalize">${partData.material}</span></div>
                    </div>
                `;

                if (mesh.userData.connections && mesh.userData.connections.length > 0) {
                    html += `
                        <div class="mt-4 pt-4 border-t border-gray-600">
                            <h4 class="text-lg font-semibold mb-2 text-white">Connections:</h4>
                            <ul class="list-disc list-inside text-sm text-gray-400 space-y-1">
                    `;
                    mesh.userData.connections.forEach(connection => {
                        const targetBody = this.world.bodies.find(b => b.userData && b.userData.id === connection.targetBodyId);
                        let targetName = "Unknown Part";
                        let targetPartId = "N/A";
                        if (targetBody && targetBody.userData && targetBody.userData.mesh && targetBody.userData.mesh.userData.partId) {
                            targetPartId = targetBody.userData.mesh.userData.partId;
                            if (this.partsData[targetPartId]) {
                                targetName = this.partsData[targetPartId].name;
                            }
                        }
                        html += `<li>Connected to: ${targetName} <span class="text-xs">(${connection.targetBodyId})</span></li>`;
                    });
                    html += `
                            </ul>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="mt-4 pt-4 border-t border-gray-600">
                             <h4 class="text-lg font-semibold mb-2 text-white">Connections:</h4>
                            <p class="text-sm text-gray-400 italic">No connections.</p>
                        </div>
                    `;
                }
                this.inspectorContent.innerHTML = html;
            }

            setMode(newMode) {
                this.mode = newMode;
                const robotControlsUI = document.getElementById('robot-controls-ui');

                if (this.mode === 'build') {
                    this.buildModeBtn.classList.add('active');
                    this.testModeBtn.classList.remove('active');
                    this.transformControls.enabled = true;
                    if(this.selectedPart) this.transformControls.attach(this.selectedPart);
                    if(robotControlsUI) robotControlsUI.classList.add('hidden');

                    // Reset physics states and ensure parts are not kinematic (if they were made so in test mode)
                    this.robotParts.forEach(mesh => {
                        const body = mesh.userData.body;
                        body.type = CANNON.Body.DYNAMIC; // Ensure body is dynamic
                        body.mass = this.partsData[mesh.userData.partId].mass; // Reset mass
                        body.updateMassProperties();

                        body.position.copy(mesh.userData.initialPosition || mesh.position);
                        body.quaternion.copy(mesh.userData.initialRotation || mesh.quaternion);
                        body.velocity.set(0,0,0);
                        body.angularVelocity.set(0,0,0);
                    });
                } else { // test mode
                    this.buildModeBtn.classList.remove('active');
                    this.testModeBtn.classList.add('active');
                    this.transformControls.detach();
                    this.transformControls.enabled = false;
                    if(robotControlsUI) robotControlsUI.classList.remove('hidden');
                    
                    // Save initial state for reset and potentially make bodies kinematic if they should not be affected by physics during user control.
                    // For now, we'll keep them dynamic as controls will apply forces/velocities.
                    this.robotParts.forEach(mesh => {
                        // Store initial position if not already stored (e.g. if switching from build to test for the first time)
                        if (!mesh.userData.initialPosition) {
                             mesh.userData.initialPosition = mesh.position.clone();
                        }
                        if (!mesh.userData.initialRotation) {
                            mesh.userData.initialRotation = mesh.quaternion.clone();
                        }
                        // Ensure physics body matches this initial state before simulation starts
                        const body = mesh.userData.body;
                        body.position.copy(mesh.userData.initialPosition);
                        body.quaternion.copy(mesh.userData.initialRotation);
                        body.velocity.set(0,0,0); // Reset velocities
                        body.angularVelocity.set(0,0,0);
                    });
                }
            }

            setTool(tool) {
                this.transformControls.setMode(tool);
                this.toolSelectBtn.classList.toggle('active', tool === 'translate');
                this.toolRotateBtn.classList.toggle('active', tool === 'rotate');
            }
            
            // --- Event Handlers ---

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
                this.fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * this.renderer.getPixelRatio());
                this.fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * this.renderer.getPixelRatio());
            }

            onMouseDown(event) {
                 if (event.target.closest('.ui-panel')) return; // Ignore UI clicks

                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                const intersects = this.raycaster.intersectObjects(this.robotParts);

                if (intersects.length > 0) {
                    if (!this.transformControls.dragging) {
                        this.selectPart(intersects[0].object);
                    }
                } else {
                    if (this.mode === 'build' && !this.transformControls.dragging) {
                        this.transformControls.detach();
                        this.selectedPart = null;
                        this.updateInspector(null);
                    }
                }
            }

            onKeyDown(event) {
                if (this.mode !== 'build') return;
                switch (event.code) {
                    case 'KeyQ': this.setTool('translate'); break;
                    case 'KeyE': this.setTool('rotate'); break;
                    case 'Delete': 
                        if (this.selectedPart) {
                            const partToDelete = this.selectedPart;
                            const bodyToDelete = partToDelete.userData.body;

                            // Remove constraints connected to this part
                            if (partToDelete.userData.connections) {
                                partToDelete.userData.connections.forEach(connection => {
                                    this.world.removeConstraint(connection.constraint);
                                    this.constraints = this.constraints.filter(c => c !== connection.constraint);

                                    // Find the other part and remove the connection from its list
                                    const otherBodyId = connection.targetBodyId;
                                    const otherMesh = this.robotParts.find(p => p.userData.body.userData.id === otherBodyId);
                                    if (otherMesh && otherMesh.userData.connections) {
                                        otherMesh.userData.connections = otherMesh.userData.connections.filter(
                                            conn => conn.constraint !== connection.constraint
                                        );
                                    }
                                });
                                partToDelete.userData.connections = []; // Clear connections from deleted part
                            }

                            this.transformControls.detach();
                            this.scene.remove(partToDelete);
                            this.world.remove(bodyToDelete);
                            this.robotParts = this.robotParts.filter(p => p !== partToDelete);
                            this.selectedPart = null;
                            this.updateInspector(null);
                            console.log('Deleted part and its constraints:', bodyToDelete.userData.id);
                        }
                        break;
                }
            }
            
            // --- Loop ---

            /**
             * Identifies the primary physics body of the constructed robot to be controlled.
             * Heuristic:
             * 1. Looks for specific chassis part IDs ('core_block', 'steel_chassis_block').
             * 2. If not found, falls back to the part with the largest mass.
             * 3. If still not found (e.g., empty scene), returns the first part added.
             * @returns {CANNON.Body | null} The identified controllable body or null.
             */
            getControlledRobotBody() {
                if (this.robotParts.length === 0) return null;

                // 1. Prioritize specific chassis parts by their partId.
                const chassisIds = ['core_block', 'steel_chassis_block'];
                for (const partId of chassisIds) {
                    const corePart = this.robotParts.find(p => p.userData.partId === partId);
                    if (corePart) return corePart.userData.body;
                }

                // 2. Fallback: find the part with the largest mass.
                // This assumes a heavier part is more likely to be the main chassis.
                let heaviestBody = null;
                let maxMass = 0;
                for (const part of this.robotParts) {
                    if (part.userData.body && part.userData.body.mass > maxMass) {
                        maxMass = part.userData.body.mass;
                        heaviestBody = part.userData.body;
                    }
                }
                if (heaviestBody) return heaviestBody;

                // 3. Absolute fallback: return the body of the first part added to the scene.
                return this.robotParts[0]?.userData.body || null;
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const deltaTime = this.clock.getDelta();
                
                if (this.mode === 'test') {
                    const controlledBody = this.getControlledRobotBody();

                    // --- Thumbstick Controls ---
                    if (controlledBody && (this.thumbstickInput.x !== 0 || this.thumbstickInput.y !== 0)) {
                        const moveForceMagnitude = 800;
                        const turnTorqueMagnitude = 500;

                        // Forward/Backward Force: Applied along the body's local Z-axis.
                        // Thumbstick Y-axis controls magnitude and direction (positive Y for forward).
                        const localForward = new CANNON.Vec3(0, 0, 1); // Assuming +Z is forward for the part.
                        const worldForward = controlledBody.quaternion.vmult(localForward); // Transform local Z to world direction.
                        const force = worldForward.scale(this.thumbstickInput.y * moveForceMagnitude);
                        controlledBody.applyForce(force, controlledBody.position); // Apply at center of mass.

                        // Rotation Torque: Applied around the body's local Y-axis.
                        // Thumbstick X-axis controls magnitude and direction (negative X for left turn, positive torque around Y).
                        const torque = new CANNON.Vec3(0, -this.thumbstickInput.x * turnTorqueMagnitude, 0); // Torque vector in local space.
                        controlledBody.applyLocalTorque(torque);
                    }

                    // --- Action Button 1: Motor Activation ---
                    if (controlledBody && this.actionButton1Active) {
                        const allPartsInRobot = this.getAllConnectedParts(controlledBody); // Get all parts of the current robot assembly.
                        allPartsInRobot.forEach(body => {
                            // Check if the part associated with this body is a motor.
                            if (body.userData && body.userData.mesh && body.userData.mesh.userData.partId) {
                                const partId = body.userData.mesh.userData.partId;
                                const partData = this.partsData[partId];
                                if (partData && partData.type === 'motor') {
                                    const motorProps = partData.specificProperties || {};
                                    const motorTorque = motorProps.maxTorque || 10; // Use defined maxTorque or a default.

                                    // Assume motor's axle is its local Y-axis. This could be refined by storing axle direction in partData.
                                    const motorAxisLocal = new CANNON.Vec3(0, 1, 0);
                                    // Apply torque in the motor's local space along its axle.
                                    body.applyLocalTorque(motorAxisLocal.scale(motorTorque));
                                }
                            }
                        });
                    }
                    // Note: Motors currently only receive torque while the button is held.
                    // No explicit "stop motor" logic is implemented on button release; they will slow due to physics.

                    this.world.step(1 / 60, deltaTime, 3); // Step the physics simulation.
                    this.robotParts.forEach(mesh => {
                        mesh.position.copy(mesh.userData.body.position);
                        mesh.quaternion.copy(mesh.userData.body.quaternion);
                    });
                } else { // build mode
                    this.orbitControls.update();
                }

                this.composer.render();
            }
        }

        window.onload = () => new BattleBotsGame();

    </script>
</body>
</html>
