<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Chimera - 3D Battle Bots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Load Cannon.js library globally -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        /* Base styles */
        body {
            font-family: 'Exo 2', sans-serif;
            background-color: #111827;
            color: #E5E7EB;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            position: absolute;
            z-index: 10;
            background-color: rgba(17, 24, 39, 0.6); /* Changed from 0.8 to 0.6 */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease-in-out;
        }
        .control-button {
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
        }
        .control-button:hover {
            transform: translateY(-2px);
            background-color: #374151;
            border-color: #4f5b70;
        }
        .control-button.active {
            background-color: #3B82F6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        /* Custom scrollbar for UI panels */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(55, 65, 81, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #6B7280;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        /* Responsive Inspector Panel */
        @media (max-width: 767px) {
            #inspector-panel {
                position: fixed; /* Use fixed to overlay */
                top: 0;
                right: -100%; /* Initially off-screen */
                width: 85%;
                max-width: 320px; /* Max sensible width on small screens */
                height: 100vh; /* Full height for slide-in */
                border-radius: 0; /* Optional: remove border-radius for full height panel */
                border-left: 1px solid rgba(55, 65, 81, 0.5); /* Add border on the visible edge */
                border-right: none; /* Remove original border if it was on the right */
                transition: right 0.3s ease-in-out; /* Animation for sliding */
                z-index: 50; /* Ensure it's above other elements like canvas */
            }
            #inspector-panel.open {
                right: 0; /* Slide in to view */
            }

            /* Left Panel adjustments for mobile */
            #left-panel {
                width: 12rem; /* Reduced width from w-72 (18rem) */
            }
            #left-panel > div:nth-child(2) > div.grid {
                grid-template-columns: repeat(2, minmax(0, 1fr)); /* Change to 2 columns */
            }
        }

        /* Responsive Bottom Panel (Mode Controls) */
        @media (max-width: 480px) {
            #bottom-panel {
                flex-direction: column; /* Stack buttons vertically */
                gap: 0.5rem; /* Tailwind gap-2 */
                padding: 0.5rem; /* Tailwind p-2 */
            }

            #bottom-panel .control-button {
                width: 100%; /* Make buttons take full width of the panel */
                justify-content: center; /* Ensure text/icon content within button is centered */
            }
        }
    </style>
</head>
<body class="antialiased">

    <div id="canvas-container"></div>

    <!-- Left Side Panel: Inventory & Tools -->
    <div id="left-panel" class="ui-panel top-4 left-4 w-72 flex flex-col h-[calc(100vh-2rem)]">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-white tracking-wider">Project: Chimera</h1>
            <p class="text-xs text-gray-400">Advanced Robotics Workshop</p>
        </div>
        
        <!-- Tools -->
        <div class="p-4 border-b border-gray-700">
            <h2 class="text-lg font-semibold mb-3">Build Tools</h2>
            <div class="grid grid-cols-3 gap-2">
                <button id="tool-select" title="Select & Move (Q)" class="control-button active p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7 19 2-7 7-2z"/></svg>
                </button>
                 <button id="tool-rotate" title="Rotate (E)" class="control-button p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2v6h6M21.5 22v-6h-6"/><path d="M22 11.5A10 10 0 0 0 3.5 12.5"/><path d="M2 12.5a10 10 0 0 0 18.5-1"/></svg>
                </button>
                <button id="tool-delete" title="Delete (Del)" class="control-button p-2 bg-gray-700 rounded-md flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
                </button>
            </div>
        </div>

        <!-- Load Default Bot Button -->
        <div class="p-4 border-b border-gray-700">
            <button id="show-load-bot-modal-btn" class="w-full control-button p-2 bg-indigo-600 hover:bg-indigo-700 rounded-md text-white font-semibold">
                Load Default Bot
            </button>
        </div>

        <!-- Inventory -->
        <div class="p-4 flex-grow overflow-y-auto custom-scrollbar">
            <h2 class="text-lg font-semibold mb-3">Inventory</h2>
            <div id="inventory-parts" class="space-y-2">
                <!-- Parts will be dynamically injected here -->
            </div>
        </div>
    </div>
    
    <!-- Right Side Panel: Inspector -->
    <div id="inspector-panel" class="ui-panel top-4 right-4 w-80 h-[calc(100vh-2rem)] flex flex-col">
        <div class="p-4 border-b border-gray-700 relative"> <!-- Added relative for button positioning -->
            <h2 class="text-lg font-semibold">Inspector</h2>
            <button id="inspector-close-btn" class="absolute top-3 right-3 text-gray-400 hover:text-white md:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="inspector-content" class="p-4 flex-grow overflow-y-auto custom-scrollbar">
            <p class="text-gray-400 text-center italic mt-4">Select a part to inspect its properties.</p>
        </div>
    </div>

    <!-- Bottom Center Panel: Mode & Sim Controls -->
    <div id="bottom-panel" class="ui-panel bottom-4 left-1/2 -translate-x-1/2 flex gap-4 p-3 items-center">
        <button id="build-mode-btn" class="control-button active px-6 py-2 rounded-md font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-4-3-5l-4.5-4.5-4.5 4.5c-2 1-3 3-3 5a7 7 0 0 0 7 7z"/></svg>
            Build
        </button>
        <button id="test-mode-btn" class="control-button px-6 py-2 rounded-md font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.66 4.96a1.32 1.32 0 0 0-1.2.14L3.14 9.42a1.32 1.32 0 0 0-.14 2.39l3.54 2.05 2.05 3.54a1.32 1.32 0 0 0 2.39-.14l4.32-6.32a1.32 1.32 0 0 0 .14-1.2L13.05 3.4a1.32 1.32 0 0 0-2.39 1.56Z"/><path d="m13.5 13.5 7 7"/></svg>
            Simulate
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
    }
    </script>

    <!-- Robot Controls UI (Thumbstick and Action Buttons) -->
    <div id="robot-controls-ui" class="hidden fixed inset-0 pointer-events-none"> <!-- Container for all controls -->
        <div id="thumbstick-area" class="absolute bottom-16 left-16 w-32 h-32 bg-gray-600/50 rounded-full flex justify-center items-center pointer-events-auto">
            <div id="thumbstick-handle" class="w-16 h-16 bg-blue-500/70 rounded-full"></div>
        </div>
        <div id="action-buttons-area" class="absolute bottom-16 right-16 flex flex-col gap-4 pointer-events-auto">
            <button id="action-button-1" class="w-20 h-20 bg-green-500/50 rounded-full text-white font-bold text-lg">A</button>
            <button id="action-button-2" class="w-20 h-20 bg-red-500/50 rounded-full text-white font-bold text-lg">B</button>
        </div>
    </div>

    <!-- Load Bot Modal -->
    <div id="load-bot-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 p-4">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-white">Load a Default BattleBot</h3>
                <button id="modal-close-btn" class="text-gray-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="default-bots-list" class="space-y-3">
                <!-- Bot buttons will be injected here by JS -->
            </div>
        </div>
    </div>

    <!-- Player Resources Display -->
    <div id="player-resources-display" class="ui-panel absolute top-4 left-4 md:left-auto md:right-4 p-2 text-xs text-gray-300 rounded-md pointer-events-none">
        <!-- Resources will be injected here -->
    </div>
    <!-- Robot Stats Display -->
    <div id="robot-stats-display" class="ui-panel absolute bottom-4 right-4 md:bottom-auto md:top-4 md:right-1/2 md:translate-x-1/2 p-2 text-xs text-gray-300 rounded-md pointer-events-none">
        <!-- Stats will be injected here -->
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
        
        // CANNON is now available globally from the script loaded in the <head>

        class BattleBotsGame {
            constructor() {
                // Collision Groups
                this.ACTIVE_ROBOT_PART_GROUP = 1;
                this.DEBRIS_PART_GROUP = 2;
                this.GROUND_GROUP = 4;

                this.playerScrap = 1000; // Initial player scrap

                this.initEngine();
                this.initPhysics();
                this.initScene();
                this.initUI(); // Default bot designs will be initialized here
                this.initControls();
                this.initEventListeners(); // Modal listeners will be set up here
                this.animate();
            }

            initEngine() {
                // --- Core Renderer ---
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
                this.camera.position.set(15, 12, 25);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('canvas-container').appendChild(this.renderer.domElement);
                
                // --- Post-Processing ---
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.5, 0.2);
                this.composer.addPass(bloomPass);
                this.fxaaPass = new ShaderPass(FXAAShader);
                this.fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * this.renderer.getPixelRatio());
                this.fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * this.renderer.getPixelRatio());
                this.composer.addPass(this.fxaaPass);

                this.clock = new THREE.Clock();
                this.robotParts = [];
                this.constraints = [];

                // Particle System
                this.particlePool = [];
                this.maxParticles = 100;
                this.activeParticles = [];
            }

            initPhysics() {
                // --- Cannon.js World ---
                this.world = new CANNON.World();
                this.world.gravity.set(0, -20, 0); // Stronger gravity
                this.world.broadphase = new CANNON.SAPBroadphase(this.world);
                this.world.solver.iterations = 20; // Increased iterations
                this.world.solver.tolerance = 0.01; // Added tolerance

                // Default contact material properties
                this.world.defaultContactMaterial.contactEquationStiffness = 1e7;
                this.world.defaultContactMaterial.contactEquationRelaxation = 4;
                
                // --- Materials ---
                this.physicsMaterials = {
                    ground: new CANNON.Material('ground'),
                    metal: new CANNON.Material('metal'),
                    wood: new CANNON.Material('wood'),
                    rubber: new CANNON.Material('rubber'),
                    concrete: new CANNON.Material('concrete'),
                    hard_wood: new CANNON.Material('hard_wood'),
                    soft_wood: new CANNON.Material('soft_wood'),
                    hard_plastic: new CANNON.Material('hard_plastic'),
                    soft_plastic: new CANNON.Material('soft_plastic'),
                    rope_material: new CANNON.Material('rope_material')
                };
                
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.metal, { friction: 0.3, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.wood, { friction: 0.5, restitution: 0.4 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.rubber, { friction: 0.8, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.metal, { friction: 0.2, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.concrete, { friction: 0.6, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.concrete, { friction: 0.7, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.concrete, this.physicsMaterials.concrete, { friction: 0.8, restitution: 0.05 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.hard_wood, { friction: 0.55, restitution: 0.3 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.hard_wood, { friction: 0.45, restitution: 0.25 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.hard_wood, this.physicsMaterials.hard_wood, { friction: 0.5, restitution: 0.3 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.soft_wood, { friction: 0.6, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.soft_wood, { friction: 0.5, restitution: 0.4 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.soft_wood, this.physicsMaterials.soft_wood, { friction: 0.55, restitution: 0.6 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.hard_plastic, { friction: 0.4, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.hard_plastic, { friction: 0.35, restitution: 0.15 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.hard_plastic, this.physicsMaterials.hard_plastic, { friction: 0.3, restitution: 0.2 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.soft_plastic, { friction: 0.7, restitution: 0.6 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.soft_plastic, { friction: 0.6, restitution: 0.5 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.soft_plastic, this.physicsMaterials.soft_plastic, { friction: 0.65, restitution: 0.7 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.ground, this.physicsMaterials.rope_material, { friction: 0.8, restitution: 0.1 }));
                this.world.addContactMaterial(new CANNON.ContactMaterial(this.physicsMaterials.metal, this.physicsMaterials.rope_material, { friction: 0.7, restitution: 0.1 }));
            }
            
            initScene() {
                this.scene.background = new THREE.Color(0x111827);
                this.scene.fog = new THREE.FogExp2(0x111827, 0.015);
                
                this.scene.add(new THREE.AmbientLight(0x404040, 0.5));
                const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
                keyLight.position.set(20, 40, 30);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.width = 4096;
                keyLight.shadow.mapSize.height = 4096;
                keyLight.shadow.camera.near = 0.5;
                keyLight.shadow.camera.far = 100;
                keyLight.shadow.camera.left = -50; keyLight.shadow.camera.right = 50;
                keyLight.shadow.camera.top = 50; keyLight.shadow.camera.bottom = -50;
                this.scene.add(keyLight);
                const fillLight = new THREE.DirectionalLight(0x8899ff, 0.5);
                fillLight.position.set(-20, 10, -30);
                this.scene.add(fillLight);
                const rimLight = new THREE.SpotLight(0xff88cc, 3);
                rimLight.position.set(0, 20, -50);
                rimLight.angle = Math.PI / 8;
                rimLight.penumbra = 0.3;
                this.scene.add(rimLight);

                const groundGeo = new THREE.PlaneGeometry(200, 200);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.7, metalness: 0.1 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);
                const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: this.physicsMaterials.ground });
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                groundBody.collisionFilterGroup = this.GROUND_GROUP;
                groundBody.collisionFilterMask = this.ACTIVE_ROBOT_PART_GROUP | this.DEBRIS_PART_GROUP | this.GROUND_GROUP;
                this.world.addBody(groundBody);
                
                const grid = new THREE.GridHelper(200, 100, 0x4f46e5, 0x444444);
                grid.material.opacity = 0.3;
                grid.material.transparent = true;
                this.scene.add(grid);

                const buildGrid = new THREE.GridHelper(50, 50, 0x00FFFF, 0x00FFFF);
                buildGrid.position.y = 0.1;
                buildGrid.material.opacity = 0.5;
                buildGrid.material.transparent = true;
                this.scene.add(buildGrid);

                this.buildNodeHighlights = [];
                this.maxBuildNodeHighlights = 50;
                const highlightGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16);
                const highlightMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
                for (let i = 0; i < this.maxBuildNodeHighlights; i++) {
                    const highlightMesh = new THREE.Mesh(highlightGeo, highlightMat);
                    highlightMesh.visible = false;
                    this.scene.add(highlightMesh);
                    this.buildNodeHighlights.push(highlightMesh);
                }

                // Initialize Particle System Material and Pool
                const particleTexture = new THREE.TextureLoader().load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABl0RVh0U29mdHdhcmUAUGFpbnQuTkVUIHYzLjUuMTFHJEvZAAAAaklEQVRYR+2c0QkAIAhDwb//2d7LCcGdInLNDPOpBwZIzK25EGAhNBV8oJ3giGfxSggE/L4jYdAtO6GPMN8LgL8uCYBvC4D/VbM8oM2u6U2/QCl8gE3rJv7+f5p3zAN3aB0GACD/gQBg8A8IABb/CMCAf2AAAPAPBABvP0XhNP+1AP8+ANMD3PZDAAAAAElFTkSuQmCC');
                this.particleMaterial = new THREE.SpriteMaterial({
                    map: particleTexture,
                    color: 0x888888, // Grey for smoke
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.NormalBlending
                });

                for (let i = 0; i < this.maxParticles; i++) {
                    const particle = new THREE.Sprite(this.particleMaterial); // Share material
                    particle.visible = false;
                    particle.scale.set(0.2, 0.2, 0.2);
                    this.scene.add(particle);
                    this.particlePool.push(particle);
                }
            }

            initUI() {

            initControls() {
                this.orbitControls = new OrbitControls(this.camera, this.renderer.domElement);
                this.orbitControls.enablePan = true;
                this.orbitControls.minDistance = 5;
                this.orbitControls.maxDistance = 100;
                this.orbitControls.target.set(0, 2, 0);
                this.orbitControls.update();

                this.transformControls = new TransformControls(this.camera, this.renderer.domElement);
                this.transformControls.addEventListener('dragging-changed', (event) => {
                    this.orbitControls.enabled = !event.value;

                    if (event.value) { // Dragging starts
                        this.updateBuildNodeHighlights();
                    } else { // Dragging ends
                        // Hide all highlights when dragging stops.
                        for (const highlightMesh of this.buildNodeHighlights) {
                            highlightMesh.visible = false;
                        }

                        // --- Snapping Logic ---
                        const draggedMesh = this.transformControls.object;
                        this.updatePhysicsBody(draggedMesh);

                        const draggedMeshWorldPosition = new THREE.Vector3();
                        draggedMesh.getWorldPosition(draggedMeshWorldPosition);
                        const draggedMeshWorldQuaternion = new THREE.Quaternion();
                        draggedMesh.getWorldQuaternion(draggedMeshWorldQuaternion);

                        const snapThreshold = 1.5;
                        const orientationSnapThreshold = -0.9;
                        let bestSnap = null;
                        let minNodeDistance = Infinity;

                        if (!draggedMesh.userData.buildNodes || draggedMesh.userData.buildNodes.length === 0) {
                            this.updatePhysicsBody(draggedMesh);
                            return;
                        }

                        for (const targetMesh of this.robotParts) {
                            if (targetMesh === draggedMesh || !targetMesh.userData.buildNodes || targetMesh.userData.buildNodes.length === 0 || (targetMesh.userData.isDestroyed && this.mode === 'test')) continue;

                            const targetMeshWorldPosition = new THREE.Vector3();
                            targetMesh.getWorldPosition(targetMeshWorldPosition);
                            const targetMeshWorldQuaternion = new THREE.Quaternion();
                            targetMesh.getWorldQuaternion(targetMeshWorldQuaternion);

                            for (const targetNode of targetMesh.userData.buildNodes) {
                                const worldTargetNodePos = new THREE.Vector3().fromArray(targetNode.pos).applyQuaternion(targetMeshWorldQuaternion).add(targetMeshWorldPosition);
                                const worldTargetNodeDir = new THREE.Vector3().fromArray(targetNode.dir).applyQuaternion(targetMeshWorldQuaternion).normalize();

                                for (const draggedNode of draggedMesh.userData.buildNodes) {
                                    const currentWorldDraggedNodePos = new THREE.Vector3().fromArray(draggedNode.pos).applyQuaternion(draggedMeshWorldQuaternion).add(draggedMeshWorldPosition);
                                    const distanceToTargetNode = currentWorldDraggedNodePos.distanceTo(worldTargetNodePos);

                                    if (distanceToTargetNode > snapThreshold) continue;

                                    const currentWorldDraggedNodeDir = new THREE.Vector3().fromArray(draggedNode.dir).applyQuaternion(draggedMeshWorldQuaternion).normalize();
                                    const desiredWorldDraggedNodeDir = worldTargetNodeDir.clone().negate();

                                    const alignRotation = new THREE.Quaternion().setFromUnitVectors(currentWorldDraggedNodeDir, desiredWorldDraggedNodeDir);
                                    const hypotheticalQuaternion = alignRotation.clone().multiply(draggedMeshWorldQuaternion);

                                    const futureWorldDraggedNodeDir = new THREE.Vector3().fromArray(draggedNode.dir).applyQuaternion(hypotheticalQuaternion).normalize();
                                    const dotProduct = futureWorldDraggedNodeDir.dot(worldTargetNodeDir);

                                    if (dotProduct < orientationSnapThreshold) {
                                        const localDraggedNodePos = new THREE.Vector3().fromArray(draggedNode.pos);
                                        const rotatedDraggedNodeOffset = localDraggedNodePos.clone().applyQuaternion(hypotheticalQuaternion);
                                        const hypotheticalPosition = worldTargetNodePos.clone().sub(rotatedDraggedNodeOffset);

                                        if (distanceToTargetNode < minNodeDistance) {
                                            minNodeDistance = distanceToTargetNode;
                                            bestSnap = {
                                                distance: distanceToTargetNode,
                                                calculatedPosition: hypotheticalPosition,
                                                calculatedQuaternion: hypotheticalQuaternion,
                                                draggedMesh: draggedMesh,
                                                targetMesh: targetMesh,
                                                draggedNodeData: draggedNode,
                                                targetNodeData: targetNode
                                            };
                                        }
                                    }
                                }
                            }
                        }

                        if (bestSnap) {
                            bestSnap.draggedMesh.position.copy(bestSnap.calculatedPosition);
                            bestSnap.draggedMesh.quaternion.copy(bestSnap.calculatedQuaternion);
                            this.updatePhysicsBody(bestSnap.draggedMesh);

                            const draggedBody = bestSnap.draggedMesh.userData.body;
                            const targetBody = bestSnap.targetMesh.userData.body;
                            let alreadyConstrained = false;
                            for (const constraint of this.constraints) {
                                if ((constraint.bodyA === draggedBody && constraint.bodyB === targetBody) ||
                                    (constraint.bodyA === targetBody && constraint.bodyB === draggedBody)) {
                                    alreadyConstrained = true;
                                    break;
                                }
                            }

                            if (!alreadyConstrained) {
                                const constraint = new CANNON.LockConstraint(draggedBody, targetBody);
                                this.world.addConstraint(constraint);
                                this.constraints.push(constraint);
                                draggedMesh.userData.connections = draggedMesh.userData.connections || [];
                                draggedMesh.userData.connections.push({ targetBodyId: targetBody.userData.id, constraint: constraint });
                                bestSnap.targetMesh.userData.connections = bestSnap.targetMesh.userData.connections || [];
                                bestSnap.targetMesh.userData.connections.push({ targetBodyId: draggedBody.userData.id, constraint: constraint });
                                console.log('Constraint added between:', draggedBody.userData.id, 'and', targetBody.userData.id);
                            }
                        } else {
                            this.updatePhysicsBody(draggedMesh);
                        }
                    } else if (!event.value) {
                        for (const highlightMesh of this.buildNodeHighlights) {
                            highlightMesh.visible = false;
                        }
                    }
                });
                this.transformControls.addEventListener('objectChange', () => this.updateBuildNodeHighlights());
                this.scene.add(this.transformControls);

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            handleActionButton1Press() {

            getAllConnectedParts(startBody) {
                const allBodies = new Set();
                const queue = [startBody];
                allBodies.add(startBody);

                const bodyIdToBodyMap = new Map();
                this.world.bodies.forEach(b => {
                    if (b.userData && b.userData.id) {
                        bodyIdToBodyMap.set(b.userData.id, b);
                    }
                });

                let head = 0;
                while(head < queue.length) {
                    const currentBody = queue[head++];
                    const currentMesh = currentBody.userData.mesh;

                    if (currentMesh && currentMesh.userData.connections) {
                        for (const connection of currentMesh.userData.connections) {
                            const connectedBody = bodyIdToBodyMap.get(connection.targetBodyId);
                            if (connectedBody && !allBodies.has(connectedBody)) {
                                allBodies.add(connectedBody);
                                queue.push(connectedBody);
                            }
                        }
                    }
                }
                return Array.from(allBodies);
            }

            initThumbstickControls() {
                if (!this.thumbstickArea || !this.thumbstickHandle) {
                    console.warn("Thumbstick UI elements not found.");
                    return;
                }

                this.thumbstickArea.addEventListener('mousedown', (e) => this.handleThumbstickStart(e));
                this.thumbstickArea.addEventListener('touchstart', (e) => this.handleThumbstickStart(e), { passive: false });

                window.addEventListener('mousemove', (e) => this.handleThumbstickMove(e));
                window.addEventListener('touchmove', (e) => this.handleThumbstickMove(e), { passive: false });

                window.addEventListener('mouseup', (e) => this.handleThumbstickEnd(e));
                window.addEventListener('touchend', (e) => this.handleThumbstickEnd(e));
            }

            handleThumbstickStart(event) {
                if (this.mode !== 'test') return;
                event.preventDefault();
                this.thumbstickActive = true;
                this.thumbstickRadius = this.thumbstickArea.offsetWidth / 2;
                const clientX = event.clientX || (event.touches && event.touches[0].clientX);
                const clientY = event.clientY || (event.touches && event.touches[0].clientY);
                if (clientX !== undefined) {
                    this.updateThumbstick(clientX, clientY);
                }
            }

            handleThumbstickMove(event) {
                if (!this.thumbstickActive || this.mode !== 'test') return;
                event.preventDefault();
                const clientX = event.clientX || (event.touches && event.touches[0].clientX);
                const clientY = event.clientY || (event.touches && event.touches[0].clientY);
                 if (clientX !== undefined) {
                    this.updateThumbstick(clientX, clientY);
                }
            }

            handleThumbstickEnd(event) {
                if (!this.thumbstickActive || this.mode !== 'test') return;
                this.thumbstickActive = false;
                this.thumbstickInput = { x: 0, y: 0 };
                this.thumbstickHandle.style.transform = 'translate(0px, 0px)';
            }

            updateThumbstick(clientX, clientY) {
                if (!this.thumbstickArea || !this.thumbstickHandle) return;

                const rect = this.thumbstickArea.getBoundingClientRect();
                const centerX = rect.left + this.thumbstickRadius;
                const centerY = rect.top + this.thumbstickRadius;

                let dx = clientX - centerX;
                let dy = clientY - centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                const handleRadius = this.thumbstickHandle.offsetWidth / 2;
                const maxHandleRadius = this.thumbstickRadius - handleRadius;

                if (distance > maxHandleRadius) {
                    dx = (dx / distance) * maxHandleRadius;
                    dy = (dy / distance) * maxHandleRadius;
                }

                this.thumbstickHandle.style.transform = `translate(${dx}px, ${dy}px)`;

                if (maxHandleRadius > 0) {
                    this.thumbstickInput.x = dx / maxHandleRadius;
                    this.thumbstickInput.y = -(dy / maxHandleRadius);
                } else {
                    this.thumbstickInput.x = 0;
                    this.thumbstickInput.y = 0;
                }
            }


            // --- Core Logic ---

            /**
             * Updates the visibility and transform of build node highlights.
             */
            updateBuildNodeHighlights() {
                for (const highlight of this.buildNodeHighlights) {
                    highlight.visible = false;
                }

                if (!this.transformControls.object || !this.transformControls.dragging) {
                    return;
                }

                const draggedMesh = this.transformControls.object;
                if (!draggedMesh.userData.buildNodes || draggedMesh.userData.buildNodes.length === 0) {
                    return;
                }

                let highlightCount = 0;
                const proximityThreshold = 1.5;
                const orientationDotThreshold = -0.7;

                const defaultUp = new THREE.Vector3(0, 1, 0);

                const draggedMeshWorldPosition = new THREE.Vector3();
                draggedMesh.getWorldPosition(draggedMeshWorldPosition);
                const draggedMeshWorldQuaternion = new THREE.Quaternion();
                draggedMesh.getWorldQuaternion(draggedMeshWorldQuaternion);

                const worldDraggedNodePos = new THREE.Vector3();
                const worldDraggedNodeDir = new THREE.Vector3();
                const targetMeshWorldPosition = new THREE.Vector3();
                const worldTargetNodePos = new THREE.Vector3();
                const worldTargetNodeDir = new THREE.Vector3();


                for (const draggedNode of draggedMesh.userData.buildNodes) {
                    worldDraggedNodePos.fromArray(draggedNode.pos).applyQuaternion(draggedMeshWorldQuaternion).add(draggedMeshWorldPosition);
                    worldDraggedNodeDir.fromArray(draggedNode.dir).applyQuaternion(draggedMeshWorldQuaternion).normalize();

                    for (const otherPartMesh of this.robotParts) {
                        if (otherPartMesh === draggedMesh || !otherPartMesh.userData.buildNodes || otherPartMesh.userData.buildNodes.length === 0 || otherPartMesh.userData.isDestroyed) {
                            continue;
                        }

                        otherPartMesh.getWorldPosition(targetMeshWorldPosition);
                        const otherPartMeshWorldQuaternion = otherPartMesh.quaternion;

                        for (const targetNode of otherPartMesh.userData.buildNodes) {
                            worldTargetNodePos.fromArray(targetNode.pos).applyQuaternion(otherPartMeshWorldQuaternion).add(targetMeshWorldPosition);
                            worldTargetNodeDir.fromArray(targetNode.dir).applyQuaternion(otherPartMeshWorldQuaternion).normalize();

                            const distance = worldDraggedNodePos.distanceTo(worldTargetNodePos);
                            if (distance > proximityThreshold) {
                                continue;
                            }

                            const dotProduct = worldDraggedNodeDir.dot(worldTargetNodeDir);
                            if (dotProduct > orientationDotThreshold) {
                                continue;
                            }

                            if (highlightCount >= this.maxBuildNodeHighlights) break;

                            const highlightMesh = this.buildNodeHighlights[highlightCount];
                            highlightMesh.position.copy(worldTargetNodePos);
                            highlightMesh.quaternion.setFromUnitVectors(defaultUp, worldTargetNodeDir);
                            highlightMesh.visible = true;
                            highlightCount++;
                        }
                        if (highlightCount >= this.maxBuildNodeHighlights) break;
                    }
                    if (highlightCount >= this.maxBuildNodeHighlights) break;
                }
            }

            clearCurrentRobot() {
                if (this.transformControls.object) {
                    this.transformControls.detach();
                }
                this.selectPart(null); // This also clears inspector and handles mobile panel state

                for (let i = this.robotParts.length - 1; i >= 0; i--) {
                    const mesh = this.robotParts[i];
                    if (mesh.userData.connections && mesh.userData.connections.length > 0) {
                        [...mesh.userData.connections].forEach(connection => {
                            this.world.removeConstraint(connection.constraint);
                            this.constraints = this.constraints.filter(c => c !== connection.constraint);

                            const otherBody = this.world.bodies.find(b => b.userData && b.userData.id === connection.targetBodyId);
                            if (otherBody && otherBody.userData.mesh && otherBody.userData.mesh.userData.connections) {
                                otherBody.userData.mesh.userData.connections = otherBody.userData.mesh.userData.connections.filter(
                                    conn => conn.constraint !== connection.constraint
                                );
                            }
                        });
                    }
                    this.world.removeBody(mesh.userData.body);
                    this.scene.remove(mesh);
                }
                this.robotParts = [];
                this.constraints = [];
                this.updateRobotStatsDisplay(); // Update stats after clearing robot
            }

            loadBotDesign(botName) {
                const design = this.defaultBotDesigns[botName];
                if (!design) {
                    console.error(`Bot design "${botName}" not found.`);
                    return;
                }

                this.clearCurrentRobot();
                const designIdToMeshMap = new Map();

                design.parts.forEach(partData => {
                    const pos = partData.position ? new THREE.Vector3().fromArray(partData.position) : null;
                    const orientQuat = partData.orientation ? new THREE.Quaternion().fromArray(partData.orientation) : null;

                    const newMesh = this.addPart(partData.partId, pos, orientQuat, partData.id);
                    if (newMesh) {
                        designIdToMeshMap.set(partData.id, newMesh);
                    }
                });

                if (design.constraints) {
                    design.constraints.forEach(constraintDef => {
                        const meshA = designIdToMeshMap.get(constraintDef.bodyAId);
                        const meshB = designIdToMeshMap.get(constraintDef.bodyBId);

                        if (meshA && meshB && meshA.userData.body && meshB.userData.body) {
                            const bodyA = meshA.userData.body;
                            const bodyB = meshB.userData.body;

                            const constraint = new CANNON.LockConstraint(bodyA, bodyB);
                            this.world.addConstraint(constraint);
                            this.constraints.push(constraint);

                            meshA.userData.connections = meshA.userData.connections || [];
                            meshA.userData.connections.push({ targetBodyId: bodyB.userData.id, constraint: constraint });

                            meshB.userData.connections = meshB.userData.connections || [];
                            meshB.userData.connections.push({ targetBodyId: bodyA.userData.id, constraint: constraint });
                        } else {
                            console.warn("Could not create constraint for design, one or both bodies not found for design IDs:", constraintDef.bodyAId, constraintDef.bodyBId);
                        }
                    });
                }
                this.updateInspector(null);
                this.updateRobotStatsDisplay(); // Update stats after loading design
                console.log(`Loaded bot design: ${botName}`);
            }

            addPart(partId, desiredPosition = null, desiredOrientation = null, designInstanceId = null) {
                if (this.mode !== 'build' && !designInstanceId) {
                     if (this.mode !== 'build') console.warn("AddPart called by user outside build mode.");
                     return null;
                }
                const data = this.partsData[partId];
                if (!data) {
                    console.error(`Part data not found for partId: ${partId}`);
                    return null;
                }

                const geo = new THREE.BoxGeometry(...data.size);
                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: data.material === 'metal' ? 0.3 : 0.8,
                    metalness: data.material === 'metal' ? 0.8 : 0.1,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                if (desiredPosition) {
                    mesh.position.copy(desiredPosition);
                } else {
                    mesh.position.set(0, 5, 0);
                }
                if (desiredOrientation) {
                    mesh.quaternion.copy(desiredOrientation);
                }

                const shape = new CANNON.Box(new CANNON.Vec3(...data.size.map(s => s / 2)));
                const body = new CANNON.Body({
                    mass: data.mass,
                    material: this.physicsMaterials[data.material] || this.physicsMaterials.metal,
                    collisionFilterGroup: this.ACTIVE_ROBOT_PART_GROUP,
                    collisionFilterMask: this.ACTIVE_ROBOT_PART_GROUP | this.GROUND_GROUP
                });
                body.addShape(shape);
                body.position.copy(mesh.position);
                body.quaternion.copy(mesh.quaternion);

                const cannonBodyId = THREE.MathUtils.generateUUID();
                body.userData = {
                    mesh: mesh,
                    id: cannonBodyId,
                    partId: partId
                };
                if (designInstanceId) {
                    mesh.userData.designInstanceId = designInstanceId;
                }

                mesh.userData.body = body;
                mesh.userData.partId = partId;
                if (data.buildNodes) {
                    mesh.userData.buildNodes = JSON.parse(JSON.stringify(data.buildNodes));
                } else {
                    mesh.userData.buildNodes = [];
                }
                mesh.userData.connections = [];
                mesh.userData.isDestroyed = false; // Initialize isDestroyed flag
                mesh.userData.health = data.health; // Initialize health
                // Ensure impactResistance is initialized, defaulting if not in partsData
                mesh.userData.impactResistance = data.impactResistance !== undefined ? data.impactResistance : 0.5;

                // Collision and Damage Logic
                body.addEventListener('collide', (event) => {
                    if (mesh.userData.isDestroyed) return; // Already destroyed

                    const contact = event.contact;
                    const impactVelocity = contact.getImpactVelocityAlongNormal();
                    const minImpactForDamage = 1.0; // Minimum impact velocity to register damage
                    const damageFactor = 20; // Multiplier for damage calculation

                    if (Math.abs(impactVelocity) > minImpactForDamage) {
                        const rawDamage = Math.abs(impactVelocity) * damageFactor;
                        const resistance = mesh.userData.impactResistance || 0;
                        const actualDamage = rawDamage * (1 - resistance);

                        mesh.userData.health -= actualDamage;
                        mesh.userData.health = Math.max(0, mesh.userData.health); // Clamp health to 0

                        console.log(`Part ${mesh.userData.partId} took ${actualDamage.toFixed(2)} damage. Health: ${mesh.userData.health.toFixed(2)}`);

                        if (this.selectedPart === mesh) {
                            this.updateInspector(mesh); // Update inspector if selected part is damaged
                        }

                        if (mesh.userData.health <= 0) {
                            this.destroyPart(body); // Call the centralized destroyPart method
                        }
                    }
                });

                this.scene.add(mesh);
                this.world.addBody(body);
                this.robotParts.push(mesh);
                // Ensure only one call before return

                if (!designInstanceId && this.mode === 'build') {
                    this.selectPart(mesh);
                }
                this.updateRobotStatsDisplay(); // Final update before returning
                return mesh;
            }
            
            selectPart(mesh) {
                // If the same part is clicked again (and it's not null), or if trying to select null when nothing is selected, do nothing.
                if(this.selectedPart === mesh) return;

                if (this.mode === 'build') {
                    if (mesh) { // A part is being selected
                        this.transformControls.attach(mesh);
                        this.selectedPart = mesh;
                        this.updateInspector(mesh); // Update content first
                        if (window.innerWidth < 768) { // Then slide open on mobile if a part is actually selected
                            document.getElementById('inspector-panel').classList.add('open');
                        }
                    } else { // Deselecting (mesh is null)
                        this.transformControls.detach();
                        this.selectedPart = null;
                        this.updateInspector(null); // This will handle closing the panel on mobile
                    }
                }
                // Note: Selection logic for 'test' mode might be different or not applicable yet.
            }

            updatePhysicsBody(mesh) {
                if (mesh && mesh.userData.body) {
                    mesh.userData.body.position.copy(mesh.position);
                    mesh.userData.body.quaternion.copy(mesh.quaternion);
                }
            }

            updateInspector(mesh) {
                if (!mesh) {
                    this.inspectorContent.innerHTML = `<p class="text-gray-400 text-center italic mt-4">Select a part to inspect.</p>`;
                    // If inspector is updated with no mesh (deselection), ensure it's closed on mobile.
                    if (window.innerWidth < 768) { // Tailwind's 'md' breakpoint is 768px
                        const inspectorPanel = document.getElementById('inspector-panel');
                        if (inspectorPanel) inspectorPanel.classList.remove('open');
                    }
                    return;
                }
                const partId = mesh.userData.partId;
                const partDef = this.partsData[partId]; // Renamed partData to partDef for clarity

                // Clear previous content
                this.inspectorContent.innerHTML = '';

                // --- Part Name Display and Input ---
                const nameHeader = document.createElement('h3');
                nameHeader.className = 'text-xl font-bold text-white';
                const displayName = mesh.userData.customName || partDef.name;
                nameHeader.textContent = displayName;
                if (mesh.userData.customName && mesh.userData.customName !== partDef.name) {
                    const originalNameSpan = document.createElement('span');
                    originalNameSpan.className = 'text-sm text-gray-400 ml-2';
                    originalNameSpan.textContent = `(${partDef.name})`;
                    nameHeader.appendChild(originalNameSpan);
                }
                this.inspectorContent.appendChild(nameHeader);

                const nameInputDiv = document.createElement('div');
                nameInputDiv.className = 'mt-2 mb-3'; // Added mb-3 for spacing
                const nameLabel = document.createElement('div');
                nameLabel.innerHTML = `<strong>Custom Name:</strong>`;
                nameInputDiv.appendChild(nameLabel);

                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.id = 'custom-name-input'; // ID for querying
                nameInput.className = 'w-full p-2 bg-gray-700 border border-gray-600 rounded-md text-white mt-1 focus:ring-indigo-500 focus:border-indigo-500';
                nameInput.placeholder = 'Enter custom name';
                nameInput.value = mesh.userData.customName || '';
                nameInputDiv.appendChild(nameInput);
                this.inspectorContent.appendChild(nameInputDiv);

                nameInput.addEventListener('change', (event) => {
                    const newCustomName = event.target.value.trim();
                    if (newCustomName) {
                        mesh.userData.customName = newCustomName;
                    } else {
                        delete mesh.userData.customName;
                    }
                    this.updateInspector(mesh); // Refresh inspector to update name display
                });

                // --- Basic Info Container (ID, Mass, Health, etc.) ---
                const basicInfoDiv = document.createElement('div');
                basicInfoDiv.className = 'space-y-2 mt-3'; // Added mt-3 for spacing
                // Note: Name header is now separate
                basicInfoDiv.innerHTML = `
                    <div><strong>ID:</strong> <span class="text-gray-400 text-xs">${mesh.userData.body.userData.id}</span></div>
                    <div><strong>Mass:</strong> <span class="text-gray-300">${partDef.mass} kg</span></div>
                    <div><strong>Health:</strong> <span class="text-gray-300">${mesh.userData.health} / ${partDef.health} ${mesh.userData.isDestroyed ? '<span class="text-red-500">(Destroyed)</span>' : ''}</span></div>
                    <div><strong>Material:</strong> <span class="text-gray-300 capitalize">${partDef.material}</span></div>
                    <div><strong>Impact Resistance:</strong> <span class="text-gray-300">${(mesh.userData.impactResistance * 100).toFixed(0)}%</span></div>
                `;
                this.inspectorContent.appendChild(basicInfoDiv);

                // --- Motor Specific Properties UI ---
                if (partDef && partDef.type === 'motor') {
                    const motorSpecificsDiv = document.createElement('div');
                    motorSpecificsDiv.className = 'mt-4 pt-4 border-t border-gray-600 space-y-2';

                    const torqueLabel = document.createElement('div');
                    torqueLabel.innerHTML = `<strong>Custom Max Torque:</strong>`;
                    motorSpecificsDiv.appendChild(torqueLabel);

                    const torqueInput = document.createElement('input');
                    torqueInput.type = 'number';
                    torqueInput.className = 'w-full p-2 bg-gray-700 border border-gray-600 rounded-md text-white mt-1 focus:ring-indigo-500 focus:border-indigo-500';
                    torqueInput.step = '0.5';

                    const body = mesh.userData.body;
                    // Initialize customMaxTorque on body.userData if it doesn't exist
                    if (!body.userData.hasOwnProperty('customMaxTorque')) {
                        body.userData.customMaxTorque = partDef.specificProperties ? (partDef.specificProperties.maxTorque !== undefined ? partDef.specificProperties.maxTorque : 10) : 10;
                    }
                    torqueInput.value = body.userData.customMaxTorque;

                    torqueInput.addEventListener('change', (event) => {
                        const newTorque = parseFloat(event.target.value);
                        if (!isNaN(newTorque)) {
                            body.userData.customMaxTorque = newTorque;
                            console.log(`Set customMaxTorque for ${partDef.name} to ${newTorque}`);
                        }
                    });
                    motorSpecificsDiv.appendChild(torqueInput);
                    this.inspectorContent.appendChild(motorSpecificsDiv);
                }

                // Connections Display
                const connectionsDiv = document.createElement('div');
                connectionsDiv.className = 'mt-4 pt-4 border-t border-gray-600';
                let connectionsHtml = `
                    <h4 class="text-lg font-semibold mb-2 text-white">Connections:</h4>
                `;
                if (mesh.userData.connections && mesh.userData.connections.length > 0) {
                    connectionsHtml += `<ul class="list-disc list-inside text-sm text-gray-400 space-y-1">`;
                    mesh.userData.connections.forEach(connection => {
                        const targetBody = this.world.bodies.find(b => b.userData && b.userData.id === connection.targetBodyId);
                        let targetName = "Unknown Part";
                        // let targetPartId = "N/A"; // Not strictly needed here
                        if (targetBody && targetBody.userData && targetBody.userData.mesh) {
                            const targetMesh = targetBody.userData.mesh;
                            const targetPartDefKey = targetMesh.userData.partId;
                            if (this.partsData[targetPartDefKey]) {
                                targetName = targetMesh.userData.customName || this.partsData[targetPartDefKey].name;
                            }
                        }
                        connectionsHtml += `<li>Connected to: ${targetName} <span class="text-xs">(${connection.targetBodyId})</span></li>`;
                    });
                    connectionsHtml += `</ul>`;
                } else {
                    connectionsHtml += `<p class="text-sm text-gray-400 italic">No connections.</p>`;
                }
                connectionsDiv.innerHTML = connectionsHtml;
                this.inspectorContent.appendChild(connectionsDiv);
            }

            setMode(newMode) {
                this.mode = newMode;
                const robotControlsUI = document.getElementById('robot-controls-ui');

                if (this.mode === 'build') {
                    this.buildModeBtn.classList.add('active');
                    this.testModeBtn.classList.remove('active');
                    this.transformControls.enabled = true;
                    if(this.selectedPart) this.transformControls.attach(this.selectedPart);
                    if(robotControlsUI) robotControlsUI.classList.add('hidden');

                    this.robotParts.forEach(mesh => {
                        const body = mesh.userData.body;
                        body.type = CANNON.Body.DYNAMIC;
                        body.mass = this.partsData[mesh.userData.partId].mass;
                        body.updateMassProperties();

                        body.position.copy(mesh.userData.initialPosition || mesh.position);
                        body.quaternion.copy(mesh.userData.initialRotation || mesh.quaternion);
                        body.velocity.set(0,0,0);
                        body.angularVelocity.set(0,0,0);
                    });
                } else { // test mode
                    this.buildModeBtn.classList.remove('active');
                    this.testModeBtn.classList.add('active');
                    this.transformControls.detach();
                    this.transformControls.enabled = false;
                    if(robotControlsUI) robotControlsUI.classList.remove('hidden');
                    
                    this.robotParts.forEach(mesh => {
                        if (!mesh.userData.initialPosition) {
                             mesh.userData.initialPosition = mesh.position.clone();
                        }
                        if (!mesh.userData.initialRotation) {
                            mesh.userData.initialRotation = mesh.quaternion.clone();
                        }
                        const body = mesh.userData.body;
                        body.position.copy(mesh.userData.initialPosition);
                        body.quaternion.copy(mesh.userData.initialRotation);
                        body.velocity.set(0,0,0);
                        body.angularVelocity.set(0,0,0);
                    });
                }
            }

            setTool(tool) {
                this.transformControls.setMode(tool);
                this.toolSelectBtn.classList.toggle('active', tool === 'translate');
                this.toolRotateBtn.classList.toggle('active', tool === 'rotate');
            }
            
            // --- Event Handlers ---

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
                this.fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * this.renderer.getPixelRatio());
                this.fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * this.renderer.getPixelRatio());
            }

            onMouseDown(event) {
                 if (event.target.closest('.ui-panel')) return;

                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                const intersects = this.raycaster.intersectObjects(this.robotParts);

                if (intersects.length > 0) {
                    const intersectedMesh = intersects[0].object;
                    if (intersectedMesh.userData && intersectedMesh.userData.isDestroyed) {
                        // Clicked on a destroyed part, treat as empty space for selection
                        if (this.mode === 'build' && this.selectedPart && !this.transformControls.dragging) {
                            this.selectPart(null); // Deselect current part
                        }
                    } else if (!this.transformControls.dragging) {
                        this.selectPart(intersectedMesh);
                         if (window.innerWidth < 768 && this.selectedPart) {
                           document.getElementById('inspector-panel').classList.add('open');
                        }
                    }
                } else {
                    if (this.mode === 'build' && !this.transformControls.dragging) {
                        if (this.selectedPart) {
                           this.selectPart(null);
                        }
                    }
                }
            }

            onKeyDown(event) {
                if (this.mode !== 'build') return;
                switch (event.code) {
                    case 'KeyQ': this.setTool('translate'); break;
                    case 'KeyE': this.setTool('rotate'); break;
                    case 'Delete': 
                        if (this.selectedPart) {
                            const partToDelete = this.selectedPart;
                            const bodyToDelete = partToDelete.userData.body;

                            if (partToDelete.userData.connections) {
                                [...partToDelete.userData.connections].forEach(connection => { // Iterate over a copy
                                    this.world.removeConstraint(connection.constraint);
                                    this.constraints = this.constraints.filter(c => c !== connection.constraint);

                                    const otherBody = this.world.bodies.find(b => b.userData && b.userData.id === connection.targetBodyId);
                                    if (otherBody && otherBody.userData.mesh && otherBody.userData.mesh.userData.connections) {
                                        otherBody.userData.mesh.userData.connections = otherBody.userData.mesh.userData.connections.filter(
                                            conn => conn.constraint !== connection.constraint
                                        );
                                    }
                                });
                                partToDelete.userData.connections = [];
                            }

                            this.transformControls.detach();
                            this.scene.remove(partToDelete);
                            this.world.remove(bodyToDelete);
                            this.robotParts = this.robotParts.filter(p => p !== partToDelete);
                            this.updateRobotStatsDisplay(); // Update stats after deleting a part
                            this.selectedPart = null;
                            this.updateInspector(null);
                            console.log('Deleted part and its constraints:', bodyToDelete.userData.id);
                        }
                        break;
                }
            }
            
            // --- Loop ---

            /**
             * Identifies the primary physics body of the constructed robot to be controlled.
             */
            getControlledRobotBody() {
                if (this.robotParts.length === 0) return null;
                const chassisIds = ['core_block', 'steel_chassis_block'];
                for (const partId of chassisIds) {
                    const corePart = this.robotParts.find(p => p.userData.partId === partId && !p.userData.isDestroyed);
                    if (corePart) return corePart.userData.body;
                }
                let heaviestBody = null;
                let maxMass = 0;
                for (const part of this.robotParts) {
                    if (part.userData.isDestroyed) continue;
                    if (part.userData.body && part.userData.body.mass > maxMass) {
                        maxMass = part.userData.body.mass;
                        heaviestBody = part.userData.body;
                    }
                }
                if (heaviestBody) return heaviestBody;
                // Find first non-destroyed part as a last resort
                const firstFunctionalPart = this.robotParts.find(p => !p.userData.isDestroyed);
                return firstFunctionalPart?.userData.body || null;
            }

            // --- Particle System Methods ---
            triggerParticleBurst(position) {
                const count = 15; // Number of particles in a burst
                const burstSpeed = 3; // Max speed of particles

                for (let i = 0; i < count; i++) {
                    if (this.particlePool.length === 0) {
                        // Optional: Could take the oldest active particle if pool is empty
                        // For now, just skip if no particles are available in the pool
                        console.warn("Particle pool empty, skipping some particles for burst.");
                        continue;
                    }
                    const particle = this.particlePool.pop();
                    const particleLifetime = 0.4 + Math.random() * 0.6; // 0.4 to 1.0 seconds

                    particle.visible = true;
                    particle.position.copy(position);
                    particle.material.opacity = 0.8; // Reset opacity
                    particle.material.color.setHex(0x888888); // Reset to smoke color
                    // particle.material.color.setHex(Math.random() > 0.3 ? (Math.random() > 0.5 ? 0xff8800 : 0xffff00) : 0x555555); // Sparks (orange/yellow) and smoke

                    particle.scale.set(0.2, 0.2, 0.2); // Reset scale

                    particle.userData.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * burstSpeed,
                        (Math.random() - 0.5) * burstSpeed * 1.5, // Bias upwards slightly
                        (Math.random() - 0.5) * burstSpeed
                    );
                    particle.userData.lifetime = particleLifetime;
                    particle.userData.age = 0;

                    this.activeParticles.push(particle);
                }
            }

            // Placeholder for destroyPart - actual implementation might be elsewhere
            // This is just to show where triggerParticleBurst would be called
            destroyPart(bodyToDestroy) {
                if (!bodyToDestroy || !bodyToDestroy.userData || !bodyToDestroy.userData.mesh) {
                    console.error("Invalid body or mesh provided to destroyPart");
                    return;
                }
                const mesh = bodyToDestroy.userData.mesh;

                // 1. Visual cues for destruction (already exists or should be here)
                mesh.userData.isDestroyed = true;
                if (!mesh.material.cloned) { // Avoid re-cloning if already done
                    mesh.material = mesh.material.clone();
                    mesh.material.cloned = true;
                }
                mesh.material.color.setHex(0x555555);
                mesh.material.opacity = 0.6;
                mesh.material.transparent = true;

                // 2. Trigger particle burst
                this.triggerParticleBurst(mesh.position);
                console.log(`Placeholder: Play part destruction sound for part ${bodyToDestroy.userData.mesh.userData.partId}`);

                // 3. Physics alterations
                bodyToDestroy.collisionFilterGroup = this.DEBRIS_PART_GROUP;
                bodyToDestroy.collisionFilterMask = this.GROUND_GROUP | this.DEBRIS_PART_GROUP;

                // Optional: Reduce mass for debris to make it less disruptive if it still has significant mass
                if (bodyToDestroy.mass > 0.2) { // Check if mass is somewhat significant
                    bodyToDestroy.mass = 0.1; // Set to a low mass
                    bodyToDestroy.updateMassProperties(); // Important to call after changing mass
                }

                // Constraint removal should be handled here or as part of a more comprehensive cleanup
                if (mesh.userData.connections) {
                    // This part would need to correctly remove constraints from the world
                    // and update other connected parts. For this example, we'll just clear.
                     console.log(`Part ${mesh.userData.partId} destroyed. Constraints should be handled.`);
                     // mesh.userData.connections = []; // Simplified for this example
                }

                // Note: Actual removal from scene/world might happen elsewhere or be delayed
                // For robust system, ensure constraints are fully managed upon destruction.
                if(this.selectedPart === mesh) {
                    this.selectPart(null); // Deselect if it was selected
                }
                this.updateInspector(mesh); // Update inspector to show destroyed state
                console.log(`Visual destruction for part ${mesh.userData.partId} complete.`);
            }

            updateRobotStatsDisplay() {
                const statsEl = document.getElementById('robot-stats-display');
                if (!statsEl) {
                    // console.warn("Robot stats display element not found."); // Optional: Warn if element is missing
                    return;
                }

                let totalMass = 0;
                let partCount = 0;
                for (const partMesh of this.robotParts) {
                    if (partMesh.userData && !partMesh.userData.isDestroyed && partMesh.userData.body) {
                        partCount++;
                        totalMass += partMesh.userData.body.mass;
                    }
                }
                statsEl.innerHTML = `Parts: ${partCount}<br>Mass: ${totalMass.toFixed(1)} kg`;
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const deltaTime = this.clock.getDelta();

                // Update active particles
                for (let i = this.activeParticles.length - 1; i >= 0; i--) {
                    const particle = this.activeParticles[i];
                    particle.userData.age += deltaTime;

                    if (particle.userData.age >= particle.userData.lifetime) {
                        particle.visible = false;
                        this.particlePool.push(particle);
                        this.activeParticles.splice(i, 1);
                        continue;
                    }

                    particle.position.addScaledVector(particle.userData.velocity, deltaTime);
                    particle.material.opacity = Math.max(0, 0.8 * (1 - (particle.userData.age / particle.userData.lifetime)));

                    const scaleProgress = particle.userData.age / particle.userData.lifetime;
                    const currentScale = Math.max(0.01, 0.2 * (1 - scaleProgress * 0.8) + 0.05 * (scaleProgress)); // Shrink, but not to zero, maybe end larger for smoke
                    particle.scale.set(currentScale, currentScale, currentScale);
                }
                
                if (this.mode === 'test') {
                    const controlledBody = this.getControlledRobotBody();

                    if (controlledBody && (this.thumbstickInput.x !== 0 || this.thumbstickInput.y !== 0)) {
                        const moveForceMagnitude = 800;
                        const turnTorqueMagnitude = 500;
                        const localForward = new CANNON.Vec3(0, 0, 1);
                        const worldForward = controlledBody.quaternion.vmult(localForward);
                        const force = worldForward.scale(this.thumbstickInput.y * moveForceMagnitude);
                        controlledBody.applyForce(force, controlledBody.position);
                        const torque = new CANNON.Vec3(0, -this.thumbstickInput.x * turnTorqueMagnitude, 0);
                        controlledBody.applyLocalTorque(torque);
                    }

                    if (controlledBody && this.actionButton1Active) {
                        const allPartsInRobot = this.getAllConnectedParts(controlledBody);
                        allPartsInRobot.forEach(body => {
                            if (body.userData && body.userData.mesh && body.userData.mesh.userData.partId && !body.userData.mesh.userData.isDestroyed) {
                                const partId = body.userData.mesh.userData.partId;
                                const motorDataFromDef = this.partsData[partId]; // motorDataFromDef is the definition from partsData

                                if (motorDataFromDef && motorDataFromDef.type === 'motor') {
                                    let motorTorque;
                                    // Prioritize customMaxTorque if it's set on the instance (body.userData)
                                    if (body.userData.hasOwnProperty('customMaxTorque')) {
                                        motorTorque = body.userData.customMaxTorque;
                                    } else {
                                        // Fallback to specificProperties in definition, then to a general default
                                        motorTorque = (motorDataFromDef.specificProperties && motorDataFromDef.specificProperties.maxTorque !== undefined)
                                            ? motorDataFromDef.specificProperties.maxTorque
                                            : 10; // General default if not in specificProperties
                                    }

                                    const motorAxisLocal = new CANNON.Vec3(0, 1, 0); // Assuming motor spins around its local Y axis
                                    const localTorqueVector = motorAxisLocal.scale(motorTorque);
                                    body.applyLocalTorque(localTorqueVector);
                                }
                            }
                        });
                    }

                    this.world.step(1 / 60, deltaTime, 3);
                    this.robotParts.forEach(mesh => {
                        mesh.position.copy(mesh.userData.body.position);
                        mesh.quaternion.copy(mesh.userData.body.quaternion);
                    });
                } else {
                    this.orbitControls.update();
                }
                this.composer.render();
            }
        }

        window.onload = () => new BattleBotsGame();
    </script>
